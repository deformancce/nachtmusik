services:
  meilisearch:
    image: getmeili/meilisearch:v1.8
    ports:
      - "7700:7700"
    environment:
      - MEILI_NO_ANALYTICS=true
      # Set MEILI_MASTER_KEY in production; omit for local dev (no auth)
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  meilisearch_data:
