<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nachtmusik — find classical music live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #0A0A0A;          /* page background */
            --bg-1: #121212;          /* surfaces */
            --bg-2: #1A1A1A;          /* elevated cards */
            --bg-3: #232323;          /* hover / focus surfaces */
            --line: #262626;          /* subtle divider */
            --line-2: #353535;        /* emphasized divider */
            --text-0: #F2EFE8;        /* primary, warm off-white */
            --text-1: #B8B3AC;        /* secondary */
            --text-2: #7A746E;        /* muted */
            --gold: #D4B788;          /* primary accent — warm champagne */
            --gold-dim: #8E7B59;      /* accent muted */
            --gold-glow: rgba(212, 183, 136, 0.12);
            --red: #C75959;           /* venue badge (Oper Leipzig style) */
            --blue: #6B8DB5;          /* venue badge (Berlin style) */
            --amber: #B89868;         /* venue badge (Gewandhaus style) */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-0);
            min-height: 100vh;
            padding: 60px 24px;
            color: var(--text-0);
            font-weight: 400;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle texture — soft radial light behind the masthead. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 800px 400px at 50% 0%, rgba(212, 183, 136, 0.04), transparent 70%),
                radial-gradient(ellipse 600px 600px at 80% 100%, rgba(107, 141, 181, 0.03), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── Masthead ─────────────────────────────────────────────────── */
        .logo {
            text-align: center;
            margin-bottom: 72px;
            padding-top: 20px;
        }
        .logo h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(56px, 9vw, 96px);
            font-weight: 500;
            font-style: italic;
            color: var(--text-0);
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 14px;
            cursor: pointer;
            transition: color 0.25s ease-out;
        }
        .logo h1:hover { color: var(--gold); }
        .logo h1 .dot {
            display: inline-block;
            width: 0.18em;
            height: 0.18em;
            border-radius: 50%;
            background: var(--gold);
            vertical-align: middle;
            margin: 0 0.04em 0.2em 0.02em;
        }
        .logo p {
            font-size: 13px;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.32em;
            font-weight: 400;
        }

        /* ── Search ───────────────────────────────────────────────────── */
        .search-box {
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 26px 28px;
            margin-bottom: 48px;
            position: relative;
            transition: border-color 0.2s ease-out;
        }
        .search-box:focus-within {
            border-color: var(--gold-dim);
        }
        .search-input {
            width: 100%;
            padding: 14px 0;
            font-size: 22px;
            font-family: inherit;
            font-weight: 400;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line-2);
            color: var(--text-0);
            outline: none;
            transition: border-color 0.2s ease-out;
        }
        .search-input::placeholder {
            color: var(--text-2);
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
        }
        .search-input:focus {
            border-bottom-color: var(--gold);
        }


        .autocomplete-dropdown {
            position: absolute;
            left: 28px;
            right: 28px;
            top: 76px;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            max-height: 380px;
            overflow-y: auto;
            z-index: 50;
        }
        .autocomplete-item {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background 0.15s ease-out;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover,
        .autocomplete-item.is-active {
            background: var(--bg-3);
        }
        .autocomplete-item .ac-label {
            font-size: 14px;
            color: var(--text-0);
            font-weight: 400;
        }
        .autocomplete-item .ac-type {
            font-size: 10px;
            color: var(--gold-dim);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 500;
        }

        /* ── Filter bar ───────────────────────────────────────────────── */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 56px;
            padding: 0 4px;
        }
        .filter-label {
            font-size: 11px;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.22em;
            margin-right: 4px;
        }
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-1);
            border: 1px solid var(--line);
            color: var(--text-1);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            letter-spacing: 0.04em;
            position: relative;
        }
        .filter-chip:hover {
            border-color: var(--gold-dim);
            color: var(--text-0);
        }
        .filter-chip.is-active {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--bg-2);
        }
        .filter-chip .chip-count {
            background: var(--gold);
            color: var(--bg-0);
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 9px;
            min-width: 18px;
            text-align: center;
        }
        .filter-chip .chip-caret {
            font-size: 9px;
            color: var(--text-2);
            margin-left: 2px;
        }
        .filter-reset {
            font-size: 11px;
            color: var(--text-2);
            background: transparent;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            padding: 8px 6px;
            transition: color 0.2s;
            font-family: inherit;
        }
        .filter-reset:hover { color: var(--gold); }

        .filter-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background: var(--bg-2);
            border: 1px solid var(--line-2);
            border-radius: 6px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
            min-width: 260px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 40;
            padding: 8px 0;
        }
        .filter-panel.is-date {
            min-width: 280px;
            padding: 16px 18px;
        }
        .filter-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-0);
            transition: background 0.15s;
            user-select: none;
        }
        .filter-option:hover { background: var(--bg-3); }
        .filter-option .opt-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-option input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--line-2);
            border-radius: 2px;
            background: transparent;
            position: relative;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .filter-option input[type="checkbox"]:checked {
            background: var(--gold);
            border-color: var(--gold);
        }
        .filter-option input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border-right: 2px solid var(--bg-0);
            border-bottom: 2px solid var(--bg-0);
            transform: rotate(45deg);
        }
        .filter-option .opt-count {
            font-size: 10px;
            color: var(--text-2);
            letter-spacing: 0.08em;
        }
        .filter-panel-label {
            font-size: 10px;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.22em;
            margin-bottom: 8px;
            display: block;
        }
        .date-input {
            width: 100%;
            background: var(--bg-1);
            border: 1px solid var(--line);
            color: var(--text-0);
            padding: 10px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 14px;
            color-scheme: dark;
        }
        .date-input:focus {
            border-color: var(--gold);
            outline: none;
        }

        /* ── Notification stub (empty-state) ──────────────────────────── */
        .notify-stub {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 22px;
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--line-2);
            padding: 12px 22px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: not-allowed;
            opacity: 0.55;
            position: relative;
        }
        .notify-stub::before {
            content: "🔔";
            font-size: 13px;
            opacity: 0.7;
        }
        .notify-stub .stub-hint {
            font-size: 9px;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-left: 6px;
            opacity: 0.7;
        }

        /* ── Concert cards ────────────────────────────────────────────── */
        .concerts-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .concerts-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 400;
            color: var(--text-0);
            letter-spacing: -0.01em;
        }
        .concerts-subtitle {
            font-size: 12px;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .concert-card {
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 24px 28px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: border-color 0.25s ease-out,
                        transform 0.25s ease-out,
                        background 0.25s ease-out;
        }
        .concert-card:hover {
            border-color: var(--line-2);
            background: var(--bg-2);
            transform: translateY(-1px);
        }
        .concert-meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .concert-date {
            font-size: 12px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .concert-time {
            font-size: 12px;
            color: var(--text-2);
            letter-spacing: 0.04em;
        }
        .concert-meta-row .dot-sep {
            color: var(--text-2);
            font-size: 10px;
            opacity: 0.6;
        }
        .venue-badge {
            font-size: 10px;
            font-weight: 500;
            padding: 3px 9px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            border: 1px solid;
        }
        .venue-leipzig-gewandhaus { color: var(--amber); border-color: rgba(184, 152, 104, 0.3); }
        .venue-leipzig-oper       { color: var(--red);   border-color: rgba(199, 89, 89, 0.3); }
        .venue-leipzig-other      { color: var(--amber); border-color: rgba(184, 152, 104, 0.25); }
        .venue-berlin             { color: var(--blue);  border-color: rgba(107, 141, 181, 0.3); }
        .venue-other              { color: var(--text-1); border-color: var(--line-2); }
        .stream-badge {
            font-size: 10px;
            font-weight: 500;
            color: var(--gold);
            padding: 3px 9px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            border: 1px solid rgba(212, 183, 136, 0.3);
        }
        .series-chip {
            font-size: 11px;
            color: var(--text-1);
            padding: 3px 0;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .concert-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 500;
            color: var(--text-0);
            margin-bottom: 6px;
            line-height: 1.2;
            letter-spacing: -0.005em;
        }
        .concert-subtitle {
            font-size: 14px;
            color: var(--text-1);
            margin-bottom: 12px;
            line-height: 1.5;
            font-weight: 300;
        }
        .concert-where {
            font-size: 12px;
            color: var(--text-2);
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }
        .concert-works-short {
            font-size: 13px;
            color: var(--text-1);
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 400;
        }

        /* ── Detail view ─────────────────────────────────────────────── */
        .detail-card {
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 48px 56px;
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-2);
            font-size: 12px;
            margin-bottom: 32px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            transition: color 0.2s ease-out;
        }
        .back-link:hover { color: var(--gold); }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .detail-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(36px, 5vw, 52px);
            font-weight: 500;
            color: var(--text-0);
            letter-spacing: -0.015em;
            margin: 16px 0 12px 0;
            line-height: 1.05;
        }
        .detail-subtitle {
            font-size: 18px;
            color: var(--text-1);
            margin-bottom: 24px;
            line-height: 1.5;
            font-weight: 300;
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
        }
        .detail-where {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 32px;
            letter-spacing: 0.04em;
        }
        .detail-section {
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid var(--line);
        }
        .detail-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--gold-dim);
            margin-bottom: 18px;
            font-weight: 500;
        }
        .detail-section ul { list-style: none; padding: 0; }
        .detail-section li {
            padding: 6px 0;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-0);
            font-weight: 300;
        }
        .detail-section li::before {
            content: "—";
            color: var(--gold-dim);
            margin-right: 12px;
        }
        .detail-description {
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-1);
            white-space: pre-wrap;
            font-weight: 300;
            max-width: 70ch;
        }
        .detail-meta-grid {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 10px 24px;
            font-size: 13px;
        }
        .detail-meta-grid dt {
            color: var(--text-2);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 11px;
            padding-top: 2px;
        }
        .detail-meta-grid dd {
            color: var(--text-0);
            font-weight: 300;
        }
        .ticket-link-big {
            display: inline-block;
            margin-top: 28px;
            background: transparent;
            color: var(--gold);
            padding: 14px 28px;
            border: 1px solid var(--gold);
            border-radius: 4px;
            font-weight: 500;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            transition: background 0.2s ease-out, color 0.2s ease-out;
        }
        .ticket-link-big:hover {
            background: var(--gold);
            color: var(--bg-0);
        }

        /* ── Search results ──────────────────────────────────────────── */
        .results { display: grid; gap: 20px; }
        .section {
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 32px 36px;
        }
        .section-header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 500;
            color: var(--text-0);
            letter-spacing: -0.01em;
        }
        .section-count {
            color: var(--gold-dim);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }
        .composer-item, .work-item {
            padding: 16px 20px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.2s ease-out, background 0.2s ease-out;
        }
        .composer-item:hover, .work-item:hover {
            border-color: var(--gold-dim);
            background: var(--bg-2);
        }
        .item-title {
            font-weight: 400;
            color: var(--text-0);
            font-size: 17px;
            margin-bottom: 6px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
        }
        .item-subtitle {
            color: var(--text-2);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        .work-meta {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 12px;
        }
        .work-composer { color: var(--gold); letter-spacing: 0.04em; }
        .work-opus { color: var(--text-1); font-family: ui-monospace, monospace; }
        .work-genre {
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 10px;
        }

        .performance-card {
            background: var(--bg-2);
            padding: 18px 20px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--line);
            cursor: pointer;
            transition: border-color 0.2s ease-out, background 0.2s ease-out;
        }
        .performance-card:hover {
            border-color: var(--gold-dim);
            background: var(--bg-3);
        }
        .matched-entry {
            background: var(--gold-glow);
            border-left: 2px solid var(--gold);
            padding: 10px 14px;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
            color: var(--gold);
            margin: 8px 0;
            font-weight: 400;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-style: italic;
        }

        /* ── Misc ─────────────────────────────────────────────────────── */
        #loadMoreBtn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-1);
            background: transparent;
            border: 1px solid var(--line-2);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s ease-out,
                        color 0.2s ease-out,
                        background 0.2s ease-out;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-family: inherit;
        }
        #loadMoreBtn:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
            background: var(--bg-1);
        }
        #loadMoreBtn:disabled { opacity: 0.4; cursor: default; }

        .loading { text-align: center; padding: 60px; color: var(--text-2); }
        .spinner {
            border: 2px solid var(--line);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 56px 32px;
            color: var(--text-2);
            background: var(--bg-1);
            border: 1px solid var(--line);
            border-radius: 10px;
        }
        .no-results h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--text-0);
            margin-bottom: 10px;
        }
        .no-results p {
            font-size: 14px;
            line-height: 1.6;
        }

        #concertsLoadingMsg {
            text-align: center;
            color: var(--text-2);
            padding: 16px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }
        #noMoreMsg {
            text-align: center;
            color: var(--text-2);
            padding: 18px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            text-transform: none;
            letter-spacing: 0;
            font-style: italic;
        }
        #scrollSentinel { height: 1px; }
        .hidden { display: none !important; }

        /* ── Scrollbar (subtle) ──────────────────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--line-2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1 id="logoTitle">nachtmusik<span class="dot"></span></h1>
            <p>find classical music live</p>
        </div>

        <!-- LIST VIEW ─────────────────────────────────────────────── -->
        <div id="listView">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Suche nach Werk, Komponist oder Konzert …"
                    autocomplete="off"
                >
<div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
            </div>

            <!-- Filter bar — populated from /api/filters on page load -->
            <div class="filter-bar" id="filterBar">
                <span class="filter-label">Filter</span>
                <div class="filter-chip-wrap" style="position:relative;">
                    <button class="filter-chip" data-filter="city">
                        Stadt <span class="chip-caret">▾</span>
                    </button>
                </div>
                <div class="filter-chip-wrap" style="position:relative;">
                    <button class="filter-chip" data-filter="venue">
                        Spielstätte <span class="chip-caret">▾</span>
                    </button>
                </div>
                <div class="filter-chip-wrap" style="position:relative;">
                    <button class="filter-chip" data-filter="date">
                        Datum <span class="chip-caret">▾</span>
                    </button>
                </div>
                <div class="filter-chip-wrap" style="position:relative;">
                    <button class="filter-chip" data-filter="series">
                        Format <span class="chip-caret">▾</span>
                    </button>
                </div>
                <button class="filter-reset hidden" id="filterReset">
                    Zurücksetzen
                </button>
            </div>

            <div id="loadingDiv" class="loading hidden">
                <div class="spinner"></div>
                <p>Suche...</p>
            </div>

            <div id="resultsDiv" class="results hidden"></div>

            <div id="concertsSection">
                <div class="concerts-header">
                    <div>
                        <div class="concerts-title">Kommende Konzerte</div>
                        <div class="concerts-subtitle" id="concertsSubtitle"></div>
                    </div>
                </div>
                <div id="concertsList"></div>
                <div id="concertsLoadingMsg" class="hidden">Lade Konzerte …</div>
                <button id="loadMoreBtn" class="hidden">Mehr anzeigen</button>
                <div id="noMoreMsg" class="hidden">Das war's für jetzt.</div>
                <div id="scrollSentinel"></div>
            </div>
        </div>

        <!-- DETAIL VIEW ───────────────────────────────────────────── -->
        <div id="detailView" class="hidden">
            <a href="#" class="back-link" id="backLink">← Zurück</a>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const PAGE_SIZE = 8;

        // ── DOM ─────────────────────────────────────────────────────────────
        const listView          = document.getElementById('listView');
        const detailView        = document.getElementById('detailView');
        const detailContent     = document.getElementById('detailContent');
        const searchInput       = document.getElementById('searchInput');
        const autocompleteDD    = document.getElementById('autocompleteDropdown');
        const loadingDiv        = document.getElementById('loadingDiv');
        const resultsDiv        = document.getElementById('resultsDiv');
        const concertsSection   = document.getElementById('concertsSection');
        const concertsList      = document.getElementById('concertsList');
        const concertsSubtitle  = document.getElementById('concertsSubtitle');
        const concertsLoadingMsg= document.getElementById('concertsLoadingMsg');
        const loadMoreBtn       = document.getElementById('loadMoreBtn');
        const noMoreMsg         = document.getElementById('noMoreMsg');
        const scrollSentinel    = document.getElementById('scrollSentinel');

        // ── Helpers ─────────────────────────────────────────────────────────
        const eventsById = new Map();  // cached for detail view

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }
        function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('de-DE',
                { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function venueBadgeClass(e) {
            const v = (e.venue || '').toLowerCase();
            const c = (e.city  || '').toLowerCase();
            if (v.includes('gewandhaus')) return 'venue-leipzig-gewandhaus';
            if (v.includes('oper leipzig')) return 'venue-leipzig-oper';
            if (c.includes('leipzig'))    return 'venue-leipzig-other';
            if (c.includes('berlin') || v.includes('berlin')) return 'venue-berlin';
            return 'venue-other';
        }
        function venueShortLabel(e) {
            const v = e.venue || '';
            if (v.includes('Gewandhaus'))    return 'Gewandhaus';
            if (v.includes('Oper Leipzig'))  return 'Oper Leipzig';
            if (v.includes('Berliner'))      return 'Berlin Philharmonie';
            if (v.includes('Musikverein'))   return v.replace('Musikverein ', 'MV ');
            return v;
        }

        function composersShort(program) {
            if (!Array.isArray(program) || !program.length) return '';
            const surnames = [];
            for (const entry of program) {
                const head = String(entry).split(':', 1)[0].trim();
                if (!head) continue;
                const tokens = head.split(/\s+/);
                const last = tokens[tokens.length - 1];
                if (last && !surnames.includes(last)) surnames.push(last);
            }
            if (!surnames.length) return '';
            if (surnames.length === 1) return `Werke von ${surnames[0]}`;
            if (surnames.length === 2) return `Werke von ${surnames[0]} und ${surnames[1]}`;
            const head = surnames.slice(0, -1).join(', ');
            return `Werke von ${head} und ${surnames[surnames.length - 1]}`;
        }

        function whereLine(e) {
            const parts = [];
            if (e.hall)    parts.push(e.hall);
            if (e.venue && e.venue !== e.hall) parts.push(e.venue);
            if (e.city && !parts.some(p => p.includes(e.city))) parts.push(e.city);
            return parts.join(' · ');
        }

        // ── Concert card (list view) ────────────────────────────────────────
        function renderConcertCard(e) {
            const stub = `
                <div class="concert-meta-row">
                    ${e.date ? `<span class="concert-date">${escapeHtml(formatDate(e.date))}</span>` : ''}
                    ${e.time ? `<span class="concert-time">${escapeHtml(e.time)} Uhr</span>` : ''}
                    ${e.venue ? `<span class="venue-badge ${venueBadgeClass(e)}">${escapeHtml(venueShortLabel(e))}</span>` : ''}
                    ${e.series ? `<span class="series-chip">${escapeHtml(e.series)}</span>` : ''}
                    ${e.has_stream ? `<span class="stream-badge">Stream</span>` : ''}
                </div>
                <div class="concert-title">${escapeHtml(e.title || 'Konzert')}</div>
                ${e.subtitle ? `<div class="concert-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
                <div class="concert-where">${escapeHtml(whereLine(e))}</div>
                ${e.program && e.program.length
                    ? `<div class="concert-works-short">${escapeHtml(composersShort(e.program))}</div>`
                    : ''}
            `;
            const wrap = document.createElement('div');
            wrap.className = 'concert-card';
            wrap.innerHTML = stub;
            wrap.addEventListener('click', () => openDetail(e.id));
            return wrap;
        }

        // ── Detail view ─────────────────────────────────────────────────────
        function renderDetail(e) {
            if (!e) {
                return `<div class="no-results">Konzert nicht gefunden.</div>`;
            }
            const program = (e.program || []).map(p =>
                `<li>♪ ${escapeHtml(p)}</li>`).join('');
            const artists = (e.artists || []).map(a =>
                `<li>${escapeHtml(a)}</li>`).join('');
            const where = whereLine(e);

            // Service / Tickets rows: only show when populated
            const meta = [];
            const push = (label, val) => {
                if (val) meta.push(`<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(val)}</dd>`);
            };
            push('Dauer', e.duration);
            push('Konzerteinführung', e.intro);
            push('Sprache', e.language);
            push('Abonnement', e.abo);
            push('Preise', e.prices);
            push('Ermäßigung', e.prices_reduced);
            push('Veranstalter', e.organizer);

            return `
                <div class="detail-card">
                    <div class="detail-header">
                        ${e.date ? `<span class="concert-date">${escapeHtml(formatDate(e.date))}</span>` : ''}
                        ${e.time ? `<span class="concert-time">${escapeHtml(e.time)} Uhr</span>` : ''}
                        ${e.venue ? `<span class="venue-badge ${venueBadgeClass(e)}">${escapeHtml(venueShortLabel(e))}</span>` : ''}
                        ${e.series ? `<span class="series-chip">${escapeHtml(e.series)}</span>` : ''}
                        ${e.has_stream ? `<span class="stream-badge">Stream verfügbar</span>` : ''}
                    </div>
                    <div class="detail-title">${escapeHtml(e.title || 'Konzert')}</div>
                    ${e.subtitle ? `<div class="detail-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
                    ${where ? `<div class="detail-where">${escapeHtml(where)}</div>` : ''}

                    ${program ? `
                        <div class="detail-section">
                            <h3>Programm</h3>
                            <ul>${program}</ul>
                        </div>` : ''}

                    ${artists ? `
                        <div class="detail-section">
                            <h3>Besetzung</h3>
                            <ul>${artists}</ul>
                        </div>` : ''}

                    ${e.description ? `
                        <div class="detail-section">
                            <h3>Info</h3>
                            <div class="detail-description">${escapeHtml(e.description)}</div>
                        </div>` : ''}

                    ${meta.length ? `
                        <div class="detail-section">
                            <h3>Service &amp; Tickets</h3>
                            <dl class="detail-meta-grid">${meta.join('')}</dl>
                        </div>` : ''}

                    ${e.url ? `<a class="ticket-link-big" href="${escapeAttr(e.url)}" target="_blank" rel="noopener">Tickets &amp; Info →</a>` : ''}
                </div>
            `;
        }

        async function openDetail(id) {
            location.hash = `event=${encodeURIComponent(id)}`;
        }

        async function showDetail(id) {
            listView.classList.add('hidden');
            detailView.classList.remove('hidden');
            window.scrollTo(0, 0);

            // Try cache first (the list-load filled eventsById)
            let event = eventsById.get(id);
            if (!event) {
                // Walk the events feed until we find it, or stop.
                // Cheap fallback — we don't have a /api/events/{id} endpoint yet.
                detailContent.innerHTML = `<div class="no-results">Lade Konzert…</div>`;
                event = await findEventInFeed(id);
            }
            detailContent.innerHTML = renderDetail(event);
        }

        async function findEventInFeed(id) {
            // Page through /api/events until we hit it. Could be ~50 events deep
            // for already-loaded ones (cached map covers the rest).
            let skip = 0;
            const lim = 50;
            while (true) {
                const res = await fetch(`${API_URL}/api/events?skip=${skip}&limit=${lim}`);
                const data = await res.json();
                for (const e of (data.events || [])) {
                    eventsById.set(e.id, e);
                    if (e.id === id) return e;
                }
                if (!data.has_more) return null;
                skip += lim;
                if (skip > 2000) return null;  // safety
            }
        }

        function showList() {
            detailView.classList.add('hidden');
            listView.classList.remove('hidden');
        }

        // ── Routing ─────────────────────────────────────────────────────────
        function handleRoute() {
            const hash = location.hash.slice(1);  // remove '#'
            const m = hash.match(/^event=(.+)$/);
            if (m) {
                showDetail(decodeURIComponent(m[1]));
            } else {
                showList();
            }
        }
        window.addEventListener('hashchange', handleRoute);
        document.getElementById('logoTitle').addEventListener('click', () => {
            location.hash = '';
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        });
        document.getElementById('backLink').addEventListener('click', (ev) => {
            ev.preventDefault();
            location.hash = '';
        });

        // ── Filter state ─────────────────────────────────────────────────────
        let filterOptions = null;   // populated from /api/filters
        const activeFilters = {
            city: new Set(),
            venue: new Set(),
            series: new Set(),
            from_date: "",
            to_date: "",
        };
        let activePanel = null;     // currently-open filter panel element

        function buildEventsQuery() {
            const p = new URLSearchParams();
            p.set("skip", String(concertsSkip));
            p.set("limit", String(PAGE_SIZE));
            if (activeFilters.city.size)   p.set("city",   [...activeFilters.city].join(","));
            if (activeFilters.venue.size)  p.set("venue",  [...activeFilters.venue].join(","));
            if (activeFilters.series.size) p.set("series", [...activeFilters.series].join(","));
            if (activeFilters.from_date)   p.set("from_date", activeFilters.from_date);
            if (activeFilters.to_date)     p.set("to_date",   activeFilters.to_date);
            return p.toString();
        }

        function activeFilterCount() {
            return activeFilters.city.size
                 + activeFilters.venue.size
                 + activeFilters.series.size
                 + (activeFilters.from_date ? 1 : 0)
                 + (activeFilters.to_date ? 1 : 0);
        }

        function updateFilterChips() {
            // Reflect counts on the chip buttons + show/hide reset button
            const counts = {
                city: activeFilters.city.size,
                venue: activeFilters.venue.size,
                series: activeFilters.series.size,
                date: (activeFilters.from_date || activeFilters.to_date) ? 1 : 0,
            };
            document.querySelectorAll('.filter-chip[data-filter]').forEach(btn => {
                const f = btn.dataset.filter;
                const n = counts[f] || 0;
                btn.classList.toggle('is-active', n > 0);
                // Strip any existing count badge, then re-add if needed
                const old = btn.querySelector('.chip-count');
                if (old) old.remove();
                if (n > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'chip-count';
                    badge.textContent = String(n);
                    btn.insertBefore(badge, btn.querySelector('.chip-caret'));
                }
            });
            const total = activeFilterCount();
            document.getElementById('filterReset').classList.toggle('hidden', total === 0);
        }

        function closePanel() {
            if (activePanel) {
                activePanel.remove();
                activePanel = null;
            }
        }

        function openPanel(chipBtn, filterKey) {
            closePanel();
            const panel = document.createElement('div');
            panel.className = 'filter-panel';

            if (filterKey === 'date') {
                panel.classList.add('is-date');
                panel.innerHTML = `
                    <label class="filter-panel-label">Von</label>
                    <input type="date" class="date-input" id="dateFromInput"
                           value="${escapeAttr(activeFilters.from_date)}"
                           min="${escapeAttr(filterOptions?.date_range?.min || '')}"
                           max="${escapeAttr(filterOptions?.date_range?.max || '')}">
                    <label class="filter-panel-label">Bis</label>
                    <input type="date" class="date-input" id="dateToInput"
                           value="${escapeAttr(activeFilters.to_date)}"
                           min="${escapeAttr(filterOptions?.date_range?.min || '')}"
                           max="${escapeAttr(filterOptions?.date_range?.max || '')}">
                `;
                chipBtn.parentNode.appendChild(panel);
                panel.querySelector('#dateFromInput').addEventListener('change', (e) => {
                    activeFilters.from_date = e.target.value;
                    updateFilterChips();
                    reloadConcerts();
                });
                panel.querySelector('#dateToInput').addEventListener('change', (e) => {
                    activeFilters.to_date = e.target.value;
                    updateFilterChips();
                    reloadConcerts();
                });
            } else {
                // Multi-select list. Source depends on the key.
                const listKey = filterKey === 'city' ? 'cities'
                              : filterKey === 'venue' ? 'venues'
                              : 'series';
                let opts = (filterOptions && filterOptions[listKey]) || [];
                // Venues filtered by currently-selected cities (if any)
                if (filterKey === 'venue' && activeFilters.city.size) {
                    opts = opts.filter(o => !o.city || activeFilters.city.has(o.city));
                }
                if (!opts.length) {
                    panel.innerHTML = `<div style="padding:14px 18px;color:var(--text-2);font-size:12px;">Keine Optionen</div>`;
                } else {
                    panel.innerHTML = opts.map(o => {
                        const checked = activeFilters[filterKey].has(o.name);
                        return `<label class="filter-option">
                            <span class="opt-left">
                                <input type="checkbox" data-value="${escapeAttr(o.name)}"${checked ? ' checked' : ''}>
                                <span>${escapeHtml(o.name)}</span>
                            </span>
                            <span class="opt-count">${o.count}</span>
                        </label>`;
                    }).join('');
                }
                chipBtn.parentNode.appendChild(panel);
                panel.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', () => {
                        const v = cb.dataset.value;
                        if (cb.checked) activeFilters[filterKey].add(v);
                        else            activeFilters[filterKey].delete(v);
                        // Clearing cities should clear the venues that no longer
                        // belong to a selected city (otherwise stale filter).
                        if (filterKey === 'city' && activeFilters.venue.size) {
                            const cities = activeFilters.city;
                            for (const v of [...activeFilters.venue]) {
                                const venueObj = (filterOptions.venues || []).find(x => x.name === v);
                                if (cities.size && venueObj && venueObj.city
                                        && !cities.has(venueObj.city)) {
                                    activeFilters.venue.delete(v);
                                }
                            }
                        }
                        updateFilterChips();
                        reloadConcerts();
                    });
                });
            }
            activePanel = panel;
        }

        document.querySelectorAll('.filter-chip[data-filter]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (activePanel && activePanel.parentNode === btn.parentNode) {
                    closePanel();
                } else {
                    openPanel(btn, btn.dataset.filter);
                }
            });
        });
        document.getElementById('filterReset').addEventListener('click', () => {
            activeFilters.city.clear();
            activeFilters.venue.clear();
            activeFilters.series.clear();
            activeFilters.from_date = "";
            activeFilters.to_date = "";
            closePanel();
            updateFilterChips();
            reloadConcerts();
        });
        // Click outside the panel to close it
        document.addEventListener('click', (e) => {
            if (activePanel && !e.target.closest('.filter-panel')
                            && !e.target.closest('.filter-chip')) {
                closePanel();
            }
        });

        async function loadFilterOptions() {
            try {
                const res = await fetch(`${API_URL}/api/filters`);
                filterOptions = await res.json();
            } catch (err) {
                console.error('Filter-Optionen konnten nicht geladen werden:', err);
                filterOptions = { cities: [], venues: [], series: [], date_range: {} };
            }
        }

        function reloadConcerts() {
            // Reset pagination + clear the list, then fetch the first page
            concertsSkip = 0;
            concertsExhausted = false;
            concertsList.innerHTML = '';
            noMoreMsg.classList.add('hidden');
            loadMoreConcerts();
        }

        // ── Concerts feed (infinite scroll) ─────────────────────────────────
        let concertsSkip = 0;
        let concertsTotal = null;
        let concertsLoading = false;
        let concertsExhausted = false;

        async function loadMoreConcerts() {
            if (concertsLoading || concertsExhausted) return;
            concertsLoading = true;
            concertsLoadingMsg.classList.remove('hidden');
            loadMoreBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/events?${buildEventsQuery()}`);
                const data = await res.json();
                concertsTotal = data.total;
                const suffix = activeFilterCount() ? ' · gefiltert' : '';
                concertsSubtitle.textContent =
                    `${concertsTotal} Konzert${concertsTotal !== 1 ? 'e' : ''}${suffix}`;

                data.events.forEach(e => {
                    eventsById.set(e.id, e);
                    concertsList.appendChild(renderConcertCard(e));
                });
                concertsSkip += data.events.length;

                if (!data.has_more || data.events.length === 0) {
                    concertsExhausted = true;
                    loadMoreBtn.classList.add('hidden');
                    if (data.events.length === 0 && concertsSkip === 0) {
                        // Filtered to zero results — show a tasteful empty state
                        concertsList.innerHTML = `<div class="no-results">
                            <h3>Keine Konzerte für diese Filterauswahl.</h3>
                            <p>Probiere weniger restriktive Filter — oder setze sie zurück.</p>
                        </div>`;
                        noMoreMsg.classList.add('hidden');
                    } else {
                        noMoreMsg.classList.remove('hidden');
                    }
                } else {
                    loadMoreBtn.classList.remove('hidden');
                    noMoreMsg.classList.add('hidden');
                }
            } catch (err) {
                console.error('Fehler beim Laden der Konzerte:', err);
            } finally {
                concertsLoading = false;
                concertsLoadingMsg.classList.add('hidden');
                loadMoreBtn.disabled = false;
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !concertsExhausted &&
                !searchInput.value.trim() && !location.hash) {
                loadMoreConcerts();
            }
        }, { rootMargin: '200px' });
        observer.observe(scrollSentinel);
        loadMoreBtn.addEventListener('click', loadMoreConcerts);

        // ── Autocomplete ────────────────────────────────────────────────────
        let acDebounce;
        let acActiveIndex = -1;
        let acItems = [];

        function hideAutocomplete() {
            autocompleteDD.classList.add('hidden');
            autocompleteDD.innerHTML = '';
            acActiveIndex = -1;
            acItems = [];
        }

        function renderAutocomplete(suggestions, query) {
            acItems = suggestions || [];
            acActiveIndex = -1;
            if (!acItems.length) {
                autocompleteDD.innerHTML = `
                    <div class="autocomplete-item" style="cursor:default;color:#888;">
                        <div class="ac-label">Keine Treffer für „${escapeHtml(query || '')}"</div>
                        <div class="ac-type">Drücke Enter um trotzdem zu suchen</div>
                    </div>`;
                autocompleteDD.classList.remove('hidden');
                return;
            }
            autocompleteDD.innerHTML = acItems.map((s, i) => `
                <div class="autocomplete-item" data-index="${i}">
                    <div class="ac-label">${escapeHtml(s.label)}</div>
                    <div class="ac-type">${s.type === 'composer' ? 'Komponist' : 'Werk'}${s.opus ? ' · ' + escapeHtml(s.opus) : ''}</div>
                </div>
            `).join('');
            autocompleteDD.classList.remove('hidden');
            autocompleteDD.querySelectorAll('.autocomplete-item[data-index]').forEach(el => {
                el.addEventListener('click', () => selectSuggestion(parseInt(el.dataset.index, 10)));
            });
        }

        function showAutocompleteError(message) {
            acItems = [];
            acActiveIndex = -1;
            autocompleteDD.innerHTML = `
                <div class="autocomplete-item" style="cursor:default;color:#c33;">
                    <div class="ac-label">⚠ ${escapeHtml(message)}</div>
                    <div class="ac-type">Läuft das Backend auf ${escapeHtml(API_URL)}?</div>
                </div>`;
            autocompleteDD.classList.remove('hidden');
        }

        function updateActive() {
            autocompleteDD.querySelectorAll('.autocomplete-item').forEach((el, i) => {
                el.classList.toggle('is-active', i === acActiveIndex);
            });
        }

        function selectSuggestion(i) {
            const s = acItems[i];
            if (!s) return;
            hideAutocomplete();
            if (s.type === 'composer') {
                searchInput.value = s.composer;
                showComposerWorks(s.composer);
            } else {
                searchInput.value = s.label;
                // For a work: directly fetch its performances
                showWorkPerformances(s.composer, s.work);
            }
        }

        async function fetchAutocomplete(q) {
            try {
                const res = await fetch(`${API_URL}/api/autocomplete?q=${encodeURIComponent(q)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderAutocomplete(data.suggestions || [], q);
            } catch (err) {
                showAutocompleteError('Suche nicht erreichbar');
            }
        }

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            clearTimeout(acDebounce);
            if (!q) {
                hideAutocomplete();
                // Restore the concerts feed
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                concertsSection.classList.remove('hidden');
                return;
            }
            acDebounce = setTimeout(() => fetchAutocomplete(q), 150);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (autocompleteDD.classList.contains('hidden') || !acItems.length) {
                if (e.key === 'Enter' && searchInput.value.trim()) {
                    runFreeSearch(searchInput.value.trim());
                }
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                acActiveIndex = (acActiveIndex + 1) % acItems.length;
                updateActive();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                acActiveIndex = (acActiveIndex - 1 + acItems.length) % acItems.length;
                updateActive();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                selectSuggestion(acActiveIndex >= 0 ? acActiveIndex : 0);
            } else if (e.key === 'Escape') {
                hideAutocomplete();
            }
        });

        document.addEventListener('click', (e) => {
            if (!autocompleteDD.contains(e.target) && e.target !== searchInput) {
                hideAutocomplete();
            }
        });

        // ── Search results ──────────────────────────────────────────────────
        async function runFreeSearch(q) {
            concertsSection.classList.add('hidden');
            resultsDiv.classList.add('hidden');
            resultsDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');
            try {
                const res = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                displayResults(data);
            } catch (err) {
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = '<div class="no-results">Fehler — läuft das Backend auf Port 8000?</div>';
            }
        }

        function displayResults(data) {
            const composers = data.composers || [];
            const works = data.works || [];
            if (!composers.length && !works.length) {
                resultsDiv.innerHTML = `<div class="no-results">
                    <h3>Keine Treffer für "${escapeHtml(data.query)}"</h3>
                    <p>Probier einen anderen Suchbegriff.</p>
                </div>`;
                return;
            }
            let html = '';
            if (composers.length) {
                html += `<div class="section">
                    <div class="section-header">
                        <span class="section-title">Komponisten</span>
                        <span class="section-count">${composers.length}</span>
                    </div>
                    ${composers.map(c => `
                        <div class="composer-item" data-name="${escapeAttr(c.name)}">
                            <div class="item-title">${escapeHtml(c.name)}</div>
                            <div class="item-subtitle">${escapeHtml(c.years || 'Lebensdaten unbekannt')}</div>
                        </div>`).join('')}
                </div>`;
            }
            if (works.length) {
                html += `<div class="section">
                    <div class="section-header">
                        <span class="section-title">Werke</span>
                        <span class="section-count">${works.length}</span>
                    </div>
                    ${works.map(w => `
                        <div class="work-item"
                             data-title="${escapeAttr(w.title)}"
                             data-composer="${escapeAttr(w.composer)}">
                            <div class="item-title">${escapeHtml(w.title)}</div>
                            <div class="work-meta">
                                <span class="work-composer">${escapeHtml(w.composer)}</span>
                                ${w.opus ? `<span class="work-opus">${escapeHtml(w.opus)}</span>` : ''}
                                ${w.genre ? `<span class="work-genre">${escapeHtml(w.genre)}</span>` : ''}
                            </div>
                        </div>`).join('')}
                </div>`;
            }
            resultsDiv.innerHTML = html;
            resultsDiv.querySelectorAll('.composer-item').forEach(el =>
                el.addEventListener('click', () => showComposerWorks(el.dataset.name)));
            resultsDiv.querySelectorAll('.work-item').forEach(el =>
                el.addEventListener('click', () => showWorkPerformances(el.dataset.composer, el.dataset.title)));
        }

        async function showComposerWorks(name) {
            concertsSection.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            try {
                const res = await fetch(`${API_URL}/api/composer/${encodeURIComponent(name)}/works`);
                const data = await res.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                if (!data.works || !data.works.length) {
                    resultsDiv.innerHTML = `<div class="no-results">
                        <h3>Keine Werke gefunden</h3><p>Für ${escapeHtml(name)} sind keine Werke in der Datenbank.</p>
                    </div>`;
                    return;
                }
                displayResults({ composers: [], works: data.works, query: name });
            } catch (err) {
                loadingDiv.classList.add('hidden');
            }
        }

        async function showWorkPerformances(composer, work) {
            concertsSection.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            try {
                const url = `${API_URL}/api/work/performances?composer=${encodeURIComponent(composer)}&work_title=${encodeURIComponent(work)}`;
                const res = await fetch(url);
                const data = await res.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                renderPerformances(composer, work, data.performances || []);
            } catch (err) {
                loadingDiv.classList.add('hidden');
            }
        }

        function renderPerformances(composer, work, performances) {
            // Cache the events so the detail-view doesn't have to round-trip
            performances.forEach(p => eventsById.set(p.id, p));
            const sorted = performances.slice().sort((a, b) =>
                (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99'));
            const header = `<div class="section-header">
                <span class="section-title">${escapeHtml(composer)} — ${escapeHtml(work)}</span>
                <span class="section-count">${sorted.length}</span>
            </div>`;
            if (!sorted.length) {
                resultsDiv.innerHTML = `<div class="section">${header}
                    <div style="padding:32px 8px;text-align:center;">
                        <p style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text-0);margin-bottom:12px;line-height:1.3;">
                            Aktuell keine Aufführung von „${escapeHtml(composer)} — ${escapeHtml(work)}"
                        </p>
                        <p style="font-size:13px;color:var(--text-2);line-height:1.7;max-width:46ch;margin:0 auto;">
                            Leipzig und Berlin haben dieses Werk gerade nicht im Spielplan.<br>
                            Schau in ein paar Tagen wieder vorbei — die Programme ergänzen sich laufend.
                        </p>
                        <button class="notify-stub" disabled title="Diese Funktion ist in Vorbereitung.">
                            Benachrichtigen
                            <span class="stub-hint">bald verfügbar</span>
                        </button>
                    </div>
                </div>`;
                return;
            }
            const cards = sorted.map(p => {
                const dateLine = p.date ? formatDate(p.date) : '';
                const where = whereLine(p);
                const artists = (p.artists || []).slice(0, 3).join(' · ');
                return `<div class="performance-card" data-id="${escapeAttr(p.id)}">
                    <div class="concert-meta-row">
                        ${p.date ? `<span class="concert-date">${escapeHtml(dateLine)}</span>` : ''}
                        ${p.time ? `<span class="concert-time">${escapeHtml(p.time)} Uhr</span>` : ''}
                        ${p.venue ? `<span class="venue-badge ${venueBadgeClass(p)}">${escapeHtml(venueShortLabel(p))}</span>` : ''}
                        ${p.has_stream ? `<span class="stream-badge">Stream</span>` : ''}
                    </div>
                    ${where ? `<div class="concert-where">${escapeHtml(where)}</div>` : ''}
                    ${p.matched_program_entry ? `<div class="matched-entry">♪ ${escapeHtml(p.matched_program_entry)}</div>` : ''}
                    ${artists ? `<div style="font-size:13px;color:#888;font-style:italic;margin:6px 0;">${escapeHtml(artists)}</div>` : ''}
                </div>`;
            }).join('');
            resultsDiv.innerHTML = `<div class="section">${header}${cards}</div>`;
            resultsDiv.querySelectorAll('.performance-card').forEach(el =>
                el.addEventListener('click', () => openDetail(el.dataset.id)));
        }

        // ── Init ────────────────────────────────────────────────────────────
        handleRoute();
        loadFilterOptions().then(() => {
            // Filter options + first page of events in parallel-ish
            loadMoreConcerts();
        });
    </script>
</body>
</html>
