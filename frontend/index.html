<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>op.us — find classical music live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #5B3A9D 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1a1a1a;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 {
            font-size: 72px;
            color: #7FD957;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            cursor: pointer;
        }
        .logo p { color: white; font-size: 18px; opacity: 0.9; }

        /* ── Search ───────────────────────────────────────────────────── */
        .search-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 20px;
            border: 3px solid #5B3A9D;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: #7FD957;
            box-shadow: 0 0 0 4px rgba(127, 217, 87, 0.2);
        }
        .search-hint { margin-top: 12px; font-size: 14px; color: #666; }
        .search-hint code {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .autocomplete-dropdown {
            position: absolute;
            left: 30px;
            right: 30px;
            top: 78px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.18);
            max-height: 360px;
            overflow-y: auto;
            z-index: 50;
        }
        .autocomplete-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #f3f3f3;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover,
        .autocomplete-item.is-active {
            background: rgba(91,58,157,0.08);
        }
        .autocomplete-item .ac-label {
            font-size: 15px;
            color: #1a1a1a;
        }
        .autocomplete-item .ac-type {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* ── Concert cards ────────────────────────────────────────────── */
        .concerts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .concerts-title { font-size: 26px; font-weight: 700; color: white; }
        .concerts-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        .concert-card {
            background: white;
            border-radius: 16px;
            padding: 22px 26px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-bottom: 16px;
            border-left: 5px solid #7FD957;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
        }
        .concert-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.28);
        }
        .concert-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .concert-date {
            font-size: 15px;
            font-weight: 700;
            color: #5B3A9D;
            background: rgba(91,58,157,0.08);
            padding: 4px 12px;
            border-radius: 8px;
        }
        .concert-time { font-size: 14px; color: #888; }
        .venue-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .venue-leipzig-gewandhaus { background: #FFE5B4; color: #8B5A00; }
        .venue-leipzig-oper       { background: #FFD2D2; color: #8B0000; }
        .venue-leipzig-other      { background: #FFEFC2; color: #806000; }
        .venue-berlin             { background: #D4E5FF; color: #1A4480; }
        .venue-other              { background: #E8E8E8; color: #555; }
        .stream-badge {
            font-size: 11px;
            font-weight: 700;
            background: #E3F8E1;
            color: #2A5C1A;
            padding: 3px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .series-chip {
            font-size: 12px;
            color: #5B3A9D;
            background: rgba(91,58,157,0.08);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 600;
        }
        .concert-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .concert-subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .concert-where {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }
        .concert-works-short {
            font-size: 13px;
            color: #444;
            font-style: italic;
        }

        /* ── Detail view ─────────────────────────────────────────────── */
        .detail-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-block;
            color: white;
            font-size: 14px;
            margin-bottom: 20px;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
        }
        .back-link:hover { background: rgba(255,255,255,0.25); }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .detail-title {
            font-size: 30px;
            font-weight: 800;
            margin: 6px 0 8px 0;
            line-height: 1.2;
        }
        .detail-subtitle {
            font-size: 17px;
            color: #444;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .detail-where {
            font-size: 15px;
            color: #666;
            margin-bottom: 24px;
        }
        .detail-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .detail-section h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5B3A9D;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .detail-section ul { list-style: none; padding: 0; }
        .detail-section li {
            padding: 4px 0;
            font-size: 15px;
            line-height: 1.5;
        }
        .detail-description {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }
        .detail-meta-grid {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 8px 16px;
            font-size: 14px;
        }
        .detail-meta-grid dt {
            color: #888;
            font-weight: 500;
        }
        .detail-meta-grid dd { color: #1a1a1a; }
        .ticket-link-big {
            display: inline-block;
            margin-top: 20px;
            background: #5B3A9D;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            font-size: 15px;
        }
        .ticket-link-big:hover { background: #4a2f80; }

        /* ── Search results ──────────────────────────────────────────── */
        .results { display: grid; gap: 20px; }
        .section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .section-title { font-size: 22px; font-weight: 700; color: #333; }
        .section-count {
            background: #5B3A9D;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .composer-item, .work-item {
            padding: 16px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .composer-item { border-left-color: #5B3A9D; }
        .work-item { border-left-color: #7FD957; }
        .composer-item:hover, .work-item:hover {
            background: #e9ecef;
            transform: translateX(4px);
        }
        .item-title { font-weight: 600; color: #333; font-size: 18px; margin-bottom: 6px; }
        .item-subtitle { color: #666; font-size: 14px; }
        .work-meta { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
        .work-composer { color: #5B3A9D; font-weight: 600; }
        .work-opus { color: #7FD957; font-weight: 500; }
        .work-genre { color: #999; }

        .performance-card {
            background: white;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #7FD957;
            cursor: pointer;
            transition: all 0.15s;
        }
        .performance-card:hover {
            background: #f8fffb;
            transform: translateX(2px);
        }
        .matched-entry {
            background: rgba(127, 217, 87, 0.15);
            border-left: 3px solid #7FD957;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #2a4a1a;
            margin: 6px 0;
            font-weight: 500;
        }

        /* ── Misc ─────────────────────────────────────────────────────── */
        #loadMoreBtn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #5B3A9D;
            background: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: all 0.2s;
            margin-top: 8px;
        }
        #loadMoreBtn:hover:not(:disabled) {
            background: #7FD957;
            color: #1a1a1a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        #loadMoreBtn:disabled { opacity: 0.5; cursor: default; }

        .loading { text-align: center; padding: 60px; color: white; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 16px;
        }

        #concertsLoadingMsg {
            text-align: center;
            color: rgba(255,255,255,0.8);
            padding: 12px 0;
            font-size: 15px;
        }
        #noMoreMsg {
            text-align: center;
            color: rgba(255,255,255,0.6);
            padding: 14px;
            font-size: 14px;
        }
        #scrollSentinel { height: 1px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1 id="logoTitle">op.us</h1>
            <p>find classical music live</p>
        </div>

        <!-- LIST VIEW ─────────────────────────────────────────────── -->
        <div id="listView">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="z.B. Brahms 3. Sinfonie"
                    autocomplete="off"
                >
                <div class="search-hint">
                    Beispiele:
                    <code>mahler 3</code> ·
                    <code>brahms requiem</code> ·
                    <code>bach weihnachts-oratorium</code>
                </div>
                <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
            </div>

            <div id="loadingDiv" class="loading hidden">
                <div class="spinner"></div>
                <p>Suche...</p>
            </div>

            <div id="resultsDiv" class="results hidden"></div>

            <div id="concertsSection">
                <div class="concerts-header">
                    <div>
                        <div class="concerts-title">Kommende Konzerte</div>
                        <div class="concerts-subtitle" id="concertsSubtitle"></div>
                    </div>
                </div>
                <div id="concertsList"></div>
                <div id="concertsLoadingMsg" class="hidden">Lade Konzerte…</div>
                <button id="loadMoreBtn" class="hidden">Weitere laden</button>
                <div id="noMoreMsg" class="hidden">Alle Konzerte geladen</div>
                <div id="scrollSentinel"></div>
            </div>
        </div>

        <!-- DETAIL VIEW ───────────────────────────────────────────── -->
        <div id="detailView" class="hidden">
            <a href="#" class="back-link" id="backLink">← Zurück</a>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const PAGE_SIZE = 8;

        // ── DOM ─────────────────────────────────────────────────────────────
        const listView          = document.getElementById('listView');
        const detailView        = document.getElementById('detailView');
        const detailContent     = document.getElementById('detailContent');
        const searchInput       = document.getElementById('searchInput');
        const autocompleteDD    = document.getElementById('autocompleteDropdown');
        const loadingDiv        = document.getElementById('loadingDiv');
        const resultsDiv        = document.getElementById('resultsDiv');
        const concertsSection   = document.getElementById('concertsSection');
        const concertsList      = document.getElementById('concertsList');
        const concertsSubtitle  = document.getElementById('concertsSubtitle');
        const concertsLoadingMsg= document.getElementById('concertsLoadingMsg');
        const loadMoreBtn       = document.getElementById('loadMoreBtn');
        const noMoreMsg         = document.getElementById('noMoreMsg');
        const scrollSentinel    = document.getElementById('scrollSentinel');

        // ── Helpers ─────────────────────────────────────────────────────────
        const eventsById = new Map();  // cached for detail view

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }
        function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('de-DE',
                { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function venueBadgeClass(e) {
            const v = (e.venue || '').toLowerCase();
            const c = (e.city  || '').toLowerCase();
            if (v.includes('gewandhaus')) return 'venue-leipzig-gewandhaus';
            if (v.includes('oper leipzig')) return 'venue-leipzig-oper';
            if (c.includes('leipzig'))    return 'venue-leipzig-other';
            if (c.includes('berlin') || v.includes('berlin')) return 'venue-berlin';
            return 'venue-other';
        }
        function venueShortLabel(e) {
            const v = e.venue || '';
            if (v.includes('Gewandhaus'))    return 'Gewandhaus';
            if (v.includes('Oper Leipzig'))  return 'Oper Leipzig';
            if (v.includes('Berliner'))      return 'Berlin Philharmonie';
            if (v.includes('Musikverein'))   return v.replace('Musikverein ', 'MV ');
            return v;
        }

        function composersShort(program) {
            if (!Array.isArray(program) || !program.length) return '';
            const surnames = [];
            for (const entry of program) {
                const head = String(entry).split(':', 1)[0].trim();
                if (!head) continue;
                const tokens = head.split(/\s+/);
                const last = tokens[tokens.length - 1];
                if (last && !surnames.includes(last)) surnames.push(last);
            }
            if (!surnames.length) return '';
            if (surnames.length === 1) return `Werke von ${surnames[0]}`;
            if (surnames.length === 2) return `Werke von ${surnames[0]} und ${surnames[1]}`;
            const head = surnames.slice(0, -1).join(', ');
            return `Werke von ${head} und ${surnames[surnames.length - 1]}`;
        }

        function whereLine(e) {
            const parts = [];
            if (e.hall)    parts.push(e.hall);
            if (e.venue && e.venue !== e.hall) parts.push(e.venue);
            if (e.city && !parts.some(p => p.includes(e.city))) parts.push(e.city);
            return parts.join(' · ');
        }

        // ── Concert card (list view) ────────────────────────────────────────
        function renderConcertCard(e) {
            const stub = `
                <div class="concert-meta-row">
                    ${e.date ? `<span class="concert-date">${escapeHtml(formatDate(e.date))}</span>` : ''}
                    ${e.time ? `<span class="concert-time">${escapeHtml(e.time)} Uhr</span>` : ''}
                    ${e.venue ? `<span class="venue-badge ${venueBadgeClass(e)}">${escapeHtml(venueShortLabel(e))}</span>` : ''}
                    ${e.series ? `<span class="series-chip">${escapeHtml(e.series)}</span>` : ''}
                    ${e.has_stream ? `<span class="stream-badge">Stream</span>` : ''}
                </div>
                <div class="concert-title">${escapeHtml(e.title || 'Konzert')}</div>
                ${e.subtitle ? `<div class="concert-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
                <div class="concert-where">${escapeHtml(whereLine(e))}</div>
                ${e.program && e.program.length
                    ? `<div class="concert-works-short">${escapeHtml(composersShort(e.program))}</div>`
                    : ''}
            `;
            const wrap = document.createElement('div');
            wrap.className = 'concert-card';
            wrap.innerHTML = stub;
            wrap.addEventListener('click', () => openDetail(e.id));
            return wrap;
        }

        // ── Detail view ─────────────────────────────────────────────────────
        function renderDetail(e) {
            if (!e) {
                return `<div class="no-results">Konzert nicht gefunden.</div>`;
            }
            const program = (e.program || []).map(p =>
                `<li>♪ ${escapeHtml(p)}</li>`).join('');
            const artists = (e.artists || []).map(a =>
                `<li>${escapeHtml(a)}</li>`).join('');
            const where = whereLine(e);

            // Service / Tickets rows: only show when populated
            const meta = [];
            const push = (label, val) => {
                if (val) meta.push(`<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(val)}</dd>`);
            };
            push('Dauer', e.duration);
            push('Konzerteinführung', e.intro);
            push('Sprache', e.language);
            push('Abonnement', e.abo);
            push('Preise', e.prices);
            push('Ermäßigung', e.prices_reduced);
            push('Veranstalter', e.organizer);

            return `
                <div class="detail-card">
                    <div class="detail-header">
                        ${e.date ? `<span class="concert-date">${escapeHtml(formatDate(e.date))}</span>` : ''}
                        ${e.time ? `<span class="concert-time">${escapeHtml(e.time)} Uhr</span>` : ''}
                        ${e.venue ? `<span class="venue-badge ${venueBadgeClass(e)}">${escapeHtml(venueShortLabel(e))}</span>` : ''}
                        ${e.series ? `<span class="series-chip">${escapeHtml(e.series)}</span>` : ''}
                        ${e.has_stream ? `<span class="stream-badge">Stream verfügbar</span>` : ''}
                    </div>
                    <div class="detail-title">${escapeHtml(e.title || 'Konzert')}</div>
                    ${e.subtitle ? `<div class="detail-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
                    ${where ? `<div class="detail-where">${escapeHtml(where)}</div>` : ''}

                    ${program ? `
                        <div class="detail-section">
                            <h3>Programm</h3>
                            <ul>${program}</ul>
                        </div>` : ''}

                    ${artists ? `
                        <div class="detail-section">
                            <h3>Besetzung</h3>
                            <ul>${artists}</ul>
                        </div>` : ''}

                    ${e.description ? `
                        <div class="detail-section">
                            <h3>Info</h3>
                            <div class="detail-description">${escapeHtml(e.description)}</div>
                        </div>` : ''}

                    ${meta.length ? `
                        <div class="detail-section">
                            <h3>Service &amp; Tickets</h3>
                            <dl class="detail-meta-grid">${meta.join('')}</dl>
                        </div>` : ''}

                    ${e.url ? `<a class="ticket-link-big" href="${escapeAttr(e.url)}" target="_blank" rel="noopener">Tickets &amp; Info →</a>` : ''}
                </div>
            `;
        }

        async function openDetail(id) {
            location.hash = `event=${encodeURIComponent(id)}`;
        }

        async function showDetail(id) {
            listView.classList.add('hidden');
            detailView.classList.remove('hidden');
            window.scrollTo(0, 0);

            // Try cache first (the list-load filled eventsById)
            let event = eventsById.get(id);
            if (!event) {
                // Walk the events feed until we find it, or stop.
                // Cheap fallback — we don't have a /api/events/{id} endpoint yet.
                detailContent.innerHTML = `<div class="no-results">Lade Konzert…</div>`;
                event = await findEventInFeed(id);
            }
            detailContent.innerHTML = renderDetail(event);
        }

        async function findEventInFeed(id) {
            // Page through /api/events until we hit it. Could be ~50 events deep
            // for already-loaded ones (cached map covers the rest).
            let skip = 0;
            const lim = 50;
            while (true) {
                const res = await fetch(`${API_URL}/api/events?skip=${skip}&limit=${lim}`);
                const data = await res.json();
                for (const e of (data.events || [])) {
                    eventsById.set(e.id, e);
                    if (e.id === id) return e;
                }
                if (!data.has_more) return null;
                skip += lim;
                if (skip > 2000) return null;  // safety
            }
        }

        function showList() {
            detailView.classList.add('hidden');
            listView.classList.remove('hidden');
        }

        // ── Routing ─────────────────────────────────────────────────────────
        function handleRoute() {
            const hash = location.hash.slice(1);  // remove '#'
            const m = hash.match(/^event=(.+)$/);
            if (m) {
                showDetail(decodeURIComponent(m[1]));
            } else {
                showList();
            }
        }
        window.addEventListener('hashchange', handleRoute);
        document.getElementById('logoTitle').addEventListener('click', () => {
            location.hash = '';
        });
        document.getElementById('backLink').addEventListener('click', (ev) => {
            ev.preventDefault();
            location.hash = '';
        });

        // ── Concerts feed (infinite scroll) ─────────────────────────────────
        let concertsSkip = 0;
        let concertsTotal = null;
        let concertsLoading = false;
        let concertsExhausted = false;

        async function loadMoreConcerts() {
            if (concertsLoading || concertsExhausted) return;
            concertsLoading = true;
            concertsLoadingMsg.classList.remove('hidden');
            loadMoreBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/events?skip=${concertsSkip}&limit=${PAGE_SIZE}`);
                const data = await res.json();
                concertsTotal = data.total;
                concertsSubtitle.textContent = `${concertsTotal} Konzert${concertsTotal !== 1 ? 'e' : ''} gefunden`;

                data.events.forEach(e => {
                    eventsById.set(e.id, e);
                    concertsList.appendChild(renderConcertCard(e));
                });
                concertsSkip += data.events.length;

                if (!data.has_more || data.events.length === 0) {
                    concertsExhausted = true;
                    loadMoreBtn.classList.add('hidden');
                    noMoreMsg.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.remove('hidden');
                    noMoreMsg.classList.add('hidden');
                }
            } catch (err) {
                console.error('Fehler beim Laden der Konzerte:', err);
            } finally {
                concertsLoading = false;
                concertsLoadingMsg.classList.add('hidden');
                loadMoreBtn.disabled = false;
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !concertsExhausted &&
                !searchInput.value.trim() && !location.hash) {
                loadMoreConcerts();
            }
        }, { rootMargin: '200px' });
        observer.observe(scrollSentinel);
        loadMoreBtn.addEventListener('click', loadMoreConcerts);

        // ── Autocomplete ────────────────────────────────────────────────────
        let acDebounce;
        let acActiveIndex = -1;
        let acItems = [];

        function hideAutocomplete() {
            autocompleteDD.classList.add('hidden');
            autocompleteDD.innerHTML = '';
            acActiveIndex = -1;
            acItems = [];
        }

        function renderAutocomplete(suggestions, query) {
            acItems = suggestions || [];
            acActiveIndex = -1;
            if (!acItems.length) {
                autocompleteDD.innerHTML = `
                    <div class="autocomplete-item" style="cursor:default;color:#888;">
                        <div class="ac-label">Keine Treffer für „${escapeHtml(query || '')}"</div>
                        <div class="ac-type">Drücke Enter um trotzdem zu suchen</div>
                    </div>`;
                autocompleteDD.classList.remove('hidden');
                return;
            }
            autocompleteDD.innerHTML = acItems.map((s, i) => `
                <div class="autocomplete-item" data-index="${i}">
                    <div class="ac-label">${escapeHtml(s.label)}</div>
                    <div class="ac-type">${s.type === 'composer' ? 'Komponist' : 'Werk'}${s.opus ? ' · ' + escapeHtml(s.opus) : ''}</div>
                </div>
            `).join('');
            autocompleteDD.classList.remove('hidden');
            autocompleteDD.querySelectorAll('.autocomplete-item[data-index]').forEach(el => {
                el.addEventListener('click', () => selectSuggestion(parseInt(el.dataset.index, 10)));
            });
        }

        function showAutocompleteError(message) {
            acItems = [];
            acActiveIndex = -1;
            autocompleteDD.innerHTML = `
                <div class="autocomplete-item" style="cursor:default;color:#c33;">
                    <div class="ac-label">⚠ ${escapeHtml(message)}</div>
                    <div class="ac-type">Läuft das Backend auf ${escapeHtml(API_URL)}?</div>
                </div>`;
            autocompleteDD.classList.remove('hidden');
        }

        function updateActive() {
            autocompleteDD.querySelectorAll('.autocomplete-item').forEach((el, i) => {
                el.classList.toggle('is-active', i === acActiveIndex);
            });
        }

        function selectSuggestion(i) {
            const s = acItems[i];
            if (!s) return;
            hideAutocomplete();
            if (s.type === 'composer') {
                searchInput.value = s.composer;
                showComposerWorks(s.composer);
            } else {
                searchInput.value = s.label;
                // For a work: directly fetch its performances
                showWorkPerformances(s.composer, s.work);
            }
        }

        async function fetchAutocomplete(q) {
            try {
                const res = await fetch(`${API_URL}/api/autocomplete?q=${encodeURIComponent(q)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderAutocomplete(data.suggestions || [], q);
            } catch (err) {
                showAutocompleteError('Suche nicht erreichbar');
            }
        }

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            clearTimeout(acDebounce);
            if (!q) {
                hideAutocomplete();
                // Restore the concerts feed
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                concertsSection.classList.remove('hidden');
                return;
            }
            acDebounce = setTimeout(() => fetchAutocomplete(q), 150);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (autocompleteDD.classList.contains('hidden') || !acItems.length) {
                if (e.key === 'Enter' && searchInput.value.trim()) {
                    runFreeSearch(searchInput.value.trim());
                }
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                acActiveIndex = (acActiveIndex + 1) % acItems.length;
                updateActive();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                acActiveIndex = (acActiveIndex - 1 + acItems.length) % acItems.length;
                updateActive();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                selectSuggestion(acActiveIndex >= 0 ? acActiveIndex : 0);
            } else if (e.key === 'Escape') {
                hideAutocomplete();
            }
        });

        document.addEventListener('click', (e) => {
            if (!autocompleteDD.contains(e.target) && e.target !== searchInput) {
                hideAutocomplete();
            }
        });

        // ── Search results ──────────────────────────────────────────────────
        async function runFreeSearch(q) {
            concertsSection.classList.add('hidden');
            resultsDiv.classList.add('hidden');
            resultsDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');
            try {
                const res = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                displayResults(data);
            } catch (err) {
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = '<div class="no-results">Fehler — läuft das Backend auf Port 8000?</div>';
            }
        }

        function displayResults(data) {
            const composers = data.composers || [];
            const works = data.works || [];
            if (!composers.length && !works.length) {
                resultsDiv.innerHTML = `<div class="no-results">
                    <h3>Keine Treffer für "${escapeHtml(data.query)}"</h3>
                    <p>Probier einen anderen Suchbegriff.</p>
                </div>`;
                return;
            }
            let html = '';
            if (composers.length) {
                html += `<div class="section">
                    <div class="section-header">
                        <span class="section-title">Komponisten</span>
                        <span class="section-count">${composers.length}</span>
                    </div>
                    ${composers.map(c => `
                        <div class="composer-item" data-name="${escapeAttr(c.name)}">
                            <div class="item-title">${escapeHtml(c.name)}</div>
                            <div class="item-subtitle">${escapeHtml(c.years || 'Lebensdaten unbekannt')}</div>
                        </div>`).join('')}
                </div>`;
            }
            if (works.length) {
                html += `<div class="section">
                    <div class="section-header">
                        <span class="section-title">Werke</span>
                        <span class="section-count">${works.length}</span>
                    </div>
                    ${works.map(w => `
                        <div class="work-item"
                             data-title="${escapeAttr(w.title)}"
                             data-composer="${escapeAttr(w.composer)}">
                            <div class="item-title">${escapeHtml(w.title)}</div>
                            <div class="work-meta">
                                <span class="work-composer">${escapeHtml(w.composer)}</span>
                                ${w.opus ? `<span class="work-opus">${escapeHtml(w.opus)}</span>` : ''}
                                ${w.genre ? `<span class="work-genre">${escapeHtml(w.genre)}</span>` : ''}
                            </div>
                        </div>`).join('')}
                </div>`;
            }
            resultsDiv.innerHTML = html;
            resultsDiv.querySelectorAll('.composer-item').forEach(el =>
                el.addEventListener('click', () => showComposerWorks(el.dataset.name)));
            resultsDiv.querySelectorAll('.work-item').forEach(el =>
                el.addEventListener('click', () => showWorkPerformances(el.dataset.composer, el.dataset.title)));
        }

        async function showComposerWorks(name) {
            concertsSection.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            try {
                const res = await fetch(`${API_URL}/api/composer/${encodeURIComponent(name)}/works`);
                const data = await res.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                if (!data.works || !data.works.length) {
                    resultsDiv.innerHTML = `<div class="no-results">
                        <h3>Keine Werke gefunden</h3><p>Für ${escapeHtml(name)} sind keine Werke in der Datenbank.</p>
                    </div>`;
                    return;
                }
                displayResults({ composers: [], works: data.works, query: name });
            } catch (err) {
                loadingDiv.classList.add('hidden');
            }
        }

        async function showWorkPerformances(composer, work) {
            concertsSection.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            try {
                const url = `${API_URL}/api/work/performances?composer=${encodeURIComponent(composer)}&work_title=${encodeURIComponent(work)}`;
                const res = await fetch(url);
                const data = await res.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                renderPerformances(composer, work, data.performances || []);
            } catch (err) {
                loadingDiv.classList.add('hidden');
            }
        }

        function renderPerformances(composer, work, performances) {
            // Cache the events so the detail-view doesn't have to round-trip
            performances.forEach(p => eventsById.set(p.id, p));
            const sorted = performances.slice().sort((a, b) =>
                (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99'));
            const header = `<div class="section-header">
                <span class="section-title">${escapeHtml(composer)} — ${escapeHtml(work)}</span>
                <span class="section-count">${sorted.length}</span>
            </div>`;
            if (!sorted.length) {
                resultsDiv.innerHTML = `<div class="section">${header}
                    <div style="padding:14px 0;color:#888;">Aktuell keine Aufführungen in der Datenbank.</div>
                </div>`;
                return;
            }
            const cards = sorted.map(p => {
                const dateLine = p.date ? formatDate(p.date) : '';
                const where = whereLine(p);
                const artists = (p.artists || []).slice(0, 3).join(' · ');
                return `<div class="performance-card" data-id="${escapeAttr(p.id)}">
                    <div class="concert-meta-row">
                        ${p.date ? `<span class="concert-date">${escapeHtml(dateLine)}</span>` : ''}
                        ${p.time ? `<span class="concert-time">${escapeHtml(p.time)} Uhr</span>` : ''}
                        ${p.venue ? `<span class="venue-badge ${venueBadgeClass(p)}">${escapeHtml(venueShortLabel(p))}</span>` : ''}
                        ${p.has_stream ? `<span class="stream-badge">Stream</span>` : ''}
                    </div>
                    ${where ? `<div class="concert-where">${escapeHtml(where)}</div>` : ''}
                    ${p.matched_program_entry ? `<div class="matched-entry">♪ ${escapeHtml(p.matched_program_entry)}</div>` : ''}
                    ${artists ? `<div style="font-size:13px;color:#888;font-style:italic;margin:6px 0;">${escapeHtml(artists)}</div>` : ''}
                </div>`;
            }).join('');
            resultsDiv.innerHTML = `<div class="section">${header}${cards}</div>`;
            resultsDiv.querySelectorAll('.performance-card').forEach(el =>
                el.addEventListener('click', () => openDetail(el.dataset.id)));
        }

        // ── Init ────────────────────────────────────────────────────────────
        handleRoute();
        loadMoreConcerts();
    </script>
</body>
</html>
