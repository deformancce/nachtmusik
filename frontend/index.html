<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>op.us — Komponisten & Werke</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #5B3A9D 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 {
            font-size: 72px;
            color: #7FD957;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .logo p { color: white; font-size: 18px; opacity: 0.9; }

        .search-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .search-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 20px;
            border: 3px solid #5B3A9D;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: #7FD957;
            box-shadow: 0 0 0 4px rgba(127, 217, 87, 0.2);
        }
        .search-hint { margin-top: 12px; font-size: 14px; color: #666; }
        .search-hint code {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        .results { display: grid; gap: 20px; }

        .section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .section-title { font-size: 22px; font-weight: 700; color: #333; }
        .section-count {
            background: #5B3A9D;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .composer-item, .work-item {
            padding: 16px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .composer-item { border-left-color: #5B3A9D; }
        .work-item { border-left-color: #7FD957; }
        .composer-item:hover, .work-item:hover {
            background: #e9ecef;
            transform: translateX(4px);
        }

        .item-title { font-weight: 600; color: #333; font-size: 18px; margin-bottom: 6px; }
        .item-subtitle { color: #666; font-size: 14px; }

        .work-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 13px;
        }
        .work-composer { color: #5B3A9D; font-weight: 600; }
        .work-opus { color: #7FD957; font-weight: 500; }
        .work-genre { color: #999; }

        .work-performances { margin-top: 8px; }

        .performance-card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #7FD957;
        }
        .performance-card .date { font-weight: 600; color: #333; margin-bottom: 4px; }
        .performance-card .venue { font-size: 13px; color: #666; margin-bottom: 6px; }
        .performance-card a { color: #5B3A9D; font-size: 13px; text-decoration: none; }
        .performance-card a:hover { text-decoration: underline; }

        /* ── Konzerte-Sektion ── */
        #concertsSection {
            margin-top: 30px;
        }
        .concerts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .concerts-title {
            font-size: 26px;
            font-weight: 700;
            color: white;
        }
        .concerts-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        .concert-card {
            background: white;
            border-radius: 16px;
            padding: 22px 26px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-bottom: 16px;
            border-left: 5px solid #7FD957;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .concert-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.28);
        }
        .concert-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .concert-date {
            font-size: 15px;
            font-weight: 700;
            color: #5B3A9D;
            background: rgba(91,58,157,0.08);
            padding: 4px 12px;
            border-radius: 8px;
        }
        .concert-time {
            font-size: 14px;
            color: #888;
        }
        .venue-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Per-venue colours so the user can scan-recognize at a glance. */
        .venue-leipzig { background: #FFE5B4; color: #8B5A00; }
        .venue-berlin  { background: #D4E5FF; color: #1A4480; }
        .venue-other   { background: #E8E8E8; color: #555; }
        .series-chip {
            font-size: 12px;
            color: #5B3A9D;
            background: rgba(91,58,157,0.08);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 600;
        }
        .concert-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .concert-location {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .concert-program {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .concert-program-item {
            padding: 2px 0;
        }
        .concert-artists {
            font-size: 13px;
            color: #888;
            font-style: italic;
            margin-bottom: 10px;
        }
        .concert-link {
            display: inline-block;
            color: #5B3A9D;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 6px 14px;
            border: 2px solid #5B3A9D;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .concert-link:hover {
            background: #5B3A9D;
            color: white;
        }
        .matched-entry {
            background: rgba(127, 217, 87, 0.15);
            border-left: 3px solid #7FD957;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #2a4a1a;
            margin-bottom: 8px;
            font-weight: 500;
        }

        #loadMoreBtn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #5B3A9D;
            background: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: all 0.2s;
            margin-top: 8px;
        }
        #loadMoreBtn:hover:not(:disabled) {
            background: #7FD957;
            color: #1a1a1a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        #loadMoreBtn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #concertsLoadingMsg {
            text-align: center;
            color: rgba(255,255,255,0.8);
            padding: 12px 0;
            font-size: 15px;
        }
        #noMoreMsg {
            text-align: center;
            color: rgba(255,255,255,0.6);
            padding: 14px;
            font-size: 14px;
        }

        /* Scroll sentinel */
        #scrollSentinel { height: 1px; }

        /* ── Search loading ── */
        .loading { text-align: center; padding: 60px; color: white; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 16px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>op.us</h1>
            <p>find classical music live</p>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Suche Komponist oder Werk..."
                autocomplete="off"
            >
            <div class="search-hint">
                Beispiele: <code>brahms 1</code> · <code>mozart requiem</code> · <code>cellosuiten</code>
            </div>
        </div>

        <div id="loadingDiv" class="loading hidden">
            <div class="spinner"></div>
            <p>Suche...</p>
        </div>

        <div id="resultsDiv" class="results hidden"></div>

        <!-- Konzerte-Startseite -->
        <div id="concertsSection">
            <div class="concerts-header">
                <div>
                    <div class="concerts-title">Kommende Konzerte</div>
                    <div class="concerts-subtitle" id="concertsSubtitle"></div>
                </div>
            </div>
            <div id="concertsList"></div>
            <div id="concertsLoadingMsg" class="hidden">Lade Konzerte…</div>
            <button id="loadMoreBtn" class="hidden">Weitere laden</button>
            <div id="noMoreMsg" class="hidden">Alle Konzerte geladen</div>
            <div id="scrollSentinel"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const PAGE_SIZE = 8;

        const searchInput = document.getElementById('searchInput');
        const loadingDiv = document.getElementById('loadingDiv');
        const resultsDiv = document.getElementById('resultsDiv');
        const concertsSection = document.getElementById('concertsSection');
        const concertsList = document.getElementById('concertsList');
        const concertsSubtitle = document.getElementById('concertsSubtitle');
        const concertsLoadingMsg = document.getElementById('concertsLoadingMsg');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const noMoreMsg = document.getElementById('noMoreMsg');
        const scrollSentinel = document.getElementById('scrollSentinel');

        let concertsSkip = 0;
        let concertsTotal = null;
        let concertsLoading = false;
        let concertsExhausted = false;

        // ── Helpers ──────────────────────────────────────────────────────────

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function escapeAttr(s) {
            return escapeHtml(s).replace(/`/g, '&#96;');
        }

        function slug(s) {
            return String(s ?? '').replace(/[^a-z0-9]/gi, '');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
        }

        // ── Concert cards ─────────────────────────────────────────────────────

        function venueBadgeClass(venue) {
            const v = (venue || '').toLowerCase();
            if (v.includes('gewandhaus')) return 'venue-leipzig';
            if (v.includes('berlin'))     return 'venue-berlin';
            return 'venue-other';
        }

        function venueShortLabel(venue) {
            const v = venue || '';
            if (v.includes('Gewandhaus')) return 'Leipzig';
            if (v.includes('Berlin'))     return 'Berlin';
            return v;
        }

        function renderConcertCard(e) {
            const program = (e.program || []);
            const artists = (e.artists || []);
            // Compose a "where" line: "Großer Saal · Berliner Philharmonie"
            const whereParts = [];
            if (e.location) whereParts.push(e.location);
            if (e.venue && e.venue !== e.location) whereParts.push(e.venue);
            const where = whereParts.join(' · ');
            return `
                <div class="concert-card">
                    <div class="concert-meta-row">
                        ${e.date ? `<span class="concert-date">${escapeHtml(formatDate(e.date))}</span>` : ''}
                        ${e.time ? `<span class="concert-time">${escapeHtml(e.time)} Uhr</span>` : ''}
                        ${e.venue ? `<span class="venue-badge ${venueBadgeClass(e.venue)}">${escapeHtml(venueShortLabel(e.venue))}</span>` : ''}
                        ${e.series ? `<span class="series-chip">${escapeHtml(e.series)}</span>` : ''}
                    </div>
                    <div class="concert-title">${escapeHtml(e.title || 'Konzert')}</div>
                    ${where ? `<div class="concert-location">${escapeHtml(where)}</div>` : ''}
                    ${program.length ? `
                        <div class="concert-program">
                            ${program.map(p => `<div class="concert-program-item">· ${escapeHtml(p)}</div>`).join('')}
                        </div>
                    ` : ''}
                    ${artists.length ? `<div class="concert-artists">${escapeHtml(artists.join(' · '))}</div>` : ''}
                    ${e.url ? `<a class="concert-link" href="${escapeAttr(e.url)}" target="_blank" rel="noopener">Tickets &amp; Info →</a>` : ''}
                </div>
            `;
        }

        async function loadMoreConcerts() {
            if (concertsLoading || concertsExhausted) return;
            concertsLoading = true;
            concertsLoadingMsg.classList.remove('hidden');
            loadMoreBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/events?skip=${concertsSkip}&limit=${PAGE_SIZE}`);
                const data = await res.json();

                concertsTotal = data.total;
                concertsSubtitle.textContent = `${concertsTotal} Konzert${concertsTotal !== 1 ? 'e' : ''} gefunden`;

                data.events.forEach(e => {
                    concertsList.insertAdjacentHTML('beforeend', renderConcertCard(e));
                });

                concertsSkip += data.events.length;

                if (!data.has_more || data.events.length === 0) {
                    concertsExhausted = true;
                    loadMoreBtn.classList.add('hidden');
                    noMoreMsg.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.remove('hidden');
                    noMoreMsg.classList.add('hidden');
                }
            } catch (err) {
                console.error('Fehler beim Laden der Konzerte:', err);
            } finally {
                concertsLoading = false;
                concertsLoadingMsg.classList.add('hidden');
                loadMoreBtn.disabled = false;
            }
        }

        // Infinite scroll via IntersectionObserver
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !concertsExhausted && !searchInput.value.trim()) {
                loadMoreConcerts();
            }
        }, { rootMargin: '200px' });
        observer.observe(scrollSentinel);

        loadMoreBtn.addEventListener('click', loadMoreConcerts);

        // ── Search ───────────────────────────────────────────────────────────

        let debounceTimer;

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 2) {
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                loadingDiv.classList.add('hidden');
                concertsSection.classList.remove('hidden');
                return;
            }

            concertsSection.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            resultsDiv.innerHTML = '';
            debounceTimer = setTimeout(() => search(query), 400);
        });

        async function search(query) {
            try {
                const response = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = '<div class="no-results">Fehler beim Laden — läuft das Backend auf Port 8000?</div>';
            }
        }

        function displayResults(data) {
            const composers = data.composers || [];
            const works = data.works || [];

            if (composers.length === 0 && works.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="no-results">
                        <h3>Keine Ergebnisse für "${escapeHtml(data.query)}"</h3>
                        <p>Versuche es mit einem anderen Suchbegriff</p>
                    </div>
                `;
                return;
            }

            let html = '';

            if (composers.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header">
                            <span class="section-title">Komponisten</span>
                            <span class="section-count">${composers.length}</span>
                        </div>
                        ${composers.map(c => `
                            <div class="composer-item" data-name="${escapeAttr(c.name)}">
                                <div class="item-title">${escapeHtml(c.name)}</div>
                                <div class="item-subtitle">${escapeHtml(c.years || 'Lebensdaten unbekannt')}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (works.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header">
                            <span class="section-title">Werke</span>
                            <span class="section-count">${works.length}</span>
                        </div>
                        ${works.map(w => `
                            <div class="work-item"
                                 data-title="${escapeAttr(w.title)}"
                                 data-composer="${escapeAttr(w.composer)}">
                                <div class="item-title">${escapeHtml(w.title)}</div>
                                <div class="work-meta">
                                    <span class="work-composer">${escapeHtml(w.composer)}</span>
                                    ${w.opus ? `<span class="work-opus">${escapeHtml(w.opus)}</span>` : ''}
                                    ${w.genre ? `<span class="work-genre">${escapeHtml(w.genre)}</span>` : ''}
                                </div>
                                <div class="work-performances" id="perf-${slug(w.title)}-${slug(w.composer)}"></div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            resultsDiv.innerHTML = html;

            resultsDiv.querySelectorAll('.composer-item').forEach(el => {
                el.addEventListener('click', () => showComposerWorks(el.dataset.name));
            });
            resultsDiv.querySelectorAll('.work-item').forEach(el => {
                el.addEventListener('click', () =>
                    checkPerformances(el.dataset.title, el.dataset.composer));
            });
        }

        async function showComposerWorks(name) {
            searchInput.value = name;
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            resultsDiv.innerHTML = '';
            concertsSection.classList.add('hidden');
            try {
                const response = await fetch(`${API_URL}/api/composer/${encodeURIComponent(name)}/works`);
                const data = await response.json();
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                if (!data.works || data.works.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="no-results">
                            <h3>Keine Werke gefunden</h3>
                            <p>Für ${escapeHtml(name)} sind keine Werke in der Datenbank.</p>
                        </div>
                    `;
                    return;
                }
                displayResults({ composers: [], works: data.works, query: name });
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.classList.add('hidden');
            }
        }

        async function checkPerformances(workTitle, composer) {
            const perfId = `perf-${slug(workTitle)}-${slug(composer)}`;
            const perfDiv = document.getElementById(perfId);
            if (!perfDiv) return;

            if (perfDiv.innerHTML) {
                perfDiv.innerHTML = '';
                return;
            }
            perfDiv.innerHTML = '<p style="color: #999; padding: 8px 0;">Suche Aufführungen...</p>';

            try {
                const response = await fetch(
                    `${API_URL}/api/work/performances?work_title=${encodeURIComponent(workTitle)}&composer=${encodeURIComponent(composer)}`
                );
                const data = await response.json();

                if (!data.performances || data.performances.length === 0) {
                    perfDiv.innerHTML = '<p style="color: #999; padding: 8px 0; font-size: 13px;">Keine aktuellen Aufführungen gefunden</p>';
                    return;
                }

                const count = data.performances.length;
                // Sort by date so the next concert appears first
                const sorted = data.performances.slice().sort((a, b) =>
                    (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99'));
                perfDiv.innerHTML = `
                    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0;">
                        <p style="color: #5B3A9D; font-weight: 600; margin-bottom: 8px;">
                            ${count} Aufführung${count > 1 ? 'en' : ''} gefunden
                        </p>
                        ${sorted.map(p => {
                            const whereParts = [];
                            if (p.location) whereParts.push(p.location);
                            if (p.venue && p.venue !== p.location) whereParts.push(p.venue);
                            const where = whereParts.join(' · ');
                            const artists = (p.artists || []).slice(0, 3).join(' · ');
                            const dateLine = p.date ? formatDate(p.date) : '';
                            return `
                                <div class="performance-card">
                                    <div class="date">
                                        ${escapeHtml(dateLine)}${p.time ? ' · ' + escapeHtml(p.time) + ' Uhr' : ''}
                                        ${p.venue ? `<span class="venue-badge ${venueBadgeClass(p.venue)}" style="margin-left:8px;">${escapeHtml(venueShortLabel(p.venue))}</span>` : ''}
                                    </div>
                                    ${where ? `<div class="venue">${escapeHtml(where)}</div>` : ''}
                                    ${p.matched_program_entry ? `<div class="matched-entry">♪ ${escapeHtml(p.matched_program_entry)}</div>` : ''}
                                    ${artists ? `<div style="font-size:12px;color:#888;font-style:italic;margin:6px 0;">${escapeHtml(artists)}</div>` : ''}
                                    ${p.url ? `<a href="${escapeAttr(p.url)}" target="_blank" rel="noopener">Tickets &amp; Info →</a>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
                perfDiv.innerHTML = '<p style="color: red; padding: 8px 0; font-size: 13px;">Fehler beim Laden</p>';
            }
        }

        // Initial load
        loadMoreConcerts();
    </script>
</body>
</html>
