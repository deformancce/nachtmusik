<script src="./crawl-data.js"></script>
<script>
    // iOS Safari hack: tiny scroll on load to collapse the bottom toolbar.
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        window.addEventListener('load', () => {
            setTimeout(() => { window.scrollTo(0, 1); }, 0);
        });
    }

    const RAW_EVENTS = window.CRAWL_EVENTS || [];
    let EVENTS = [];
    const VENUES = window.CRAWL_VENUES || [];
    const SEARCH_API = '/api/search';
    let searchRequestSeq = 0;
    let searchDebounceTimer = null;
    let activeVenue = null;
    let showAllEvents = false;
    let visibleLimit = 65;
    let activeSuggestion = -1;
    let currentSuggestions = [];

    const SEARCH_ALIASES = {
        "brahms": ["johannes brahms"],
        "beethoven": ["ludwig van beethoven"],
        "mozart": ["wolfgang amadeus mozart"],
        "bach": ["johann sebastian bach", "j s bach"],
        "mahler": ["gustav mahler"],
        "schubert": ["franz schubert"],
        "schumann": ["robert schumann", "clara schumann"],
        "mendelssohn": ["felix mendelssohn", "felix mendelssohn bartholdy"],
        "strauss": ["richard strauss", "johann strauss"],
        "weber": ["carl maria von weber", "c m weber", "cm weber"],
        "tschaikowsky": ["tchaikovsky", "peter iljitsch tschaikowsky", "pyotr ilyich tchaikovsky"],
        "tchaikovsky": ["tschaikowsky", "peter iljitsch tschaikowsky"],
        "dvorak": ["dvorak", "antonin dvorak", "antonín dvořák"],
        "prokofjew": ["prokofiev", "sergej prokofjew", "sergei prokofiev"],
        "prokofiev": ["prokofjew", "sergej prokofjew"],
        "bartok": ["bartók", "bela bartok", "béla bartók"],
        "dimitri": ["dmitri", "dmitrij"],
        "dmitri": ["dimitri", "dmitrij"],
        "dmitrij": ["dimitri", "dmitri"],
        "schostakowitsch": ["shostakovich"],
        "shostakovich": ["schostakowitsch"],
        "symphony": ["symphonie", "sinfonie", "sinfonia"],
        "symphonie": ["symphony", "sinfonie", "sinfonia"],
        "sinfonie": ["symphony", "symphonie", "sinfonia"],
        "piano": ["klavier"],
        "klavier": ["piano"],
        "concerto": ["konzert"],
        "konzert": ["concerto"],
        "violin": ["violine", "geige"],
        "violine": ["violin", "geige"],
        "quartet": ["quartett"],
        "quartett": ["quartet"],
        "erste": ["1"],
        "erster": ["1"],
        "first": ["1"],
        "zweite": ["2"],
        "zweiter": ["2"],
        "second": ["2"],
        "dritte": ["3"],
        "dritter": ["3"],
        "third": ["3"],
        "vierte": ["4"],
        "vierter": ["4"],
        "fourth": ["4"],
        "fuenfte": ["5"],
        "fünfte": ["5"],
        "fuenfter": ["5"],
        "fünfter": ["5"],
        "fifth": ["5"],
    };

    const WORK_WORDS = ["symphonie", "sinfonie", "symphony", "konzert", "concerto", "quartett", "quartet", "sonate", "messe"];
    const COMPOSER_DISPLAY_NAMES = {
        "bach": "Johann Sebastian Bach",
        "j s bach": "Johann Sebastian Bach",
        "js bach": "Johann Sebastian Bach",
        "beethoven": "Ludwig van Beethoven",
        "l v beethoven": "Ludwig van Beethoven",
        "lv beethoven": "Ludwig van Beethoven",
        "brahms": "Johannes Brahms",
        "j brahms": "Johannes Brahms",
        "joh brahms": "Johannes Brahms",
        "mahler": "Gustav Mahler",
        "g mahler": "Gustav Mahler",
        "mozart": "Wolfgang Amadeus Mozart",
        "w a mozart": "Wolfgang Amadeus Mozart",
        "wa mozart": "Wolfgang Amadeus Mozart",
        "schubert": "Franz Schubert",
        "f schubert": "Franz Schubert",
        "f schuberts": "Franz Schubert",
        "schumann": "Robert Schumann",
        "r schumann": "Robert Schumann",
        "mendelssohn": "Felix Mendelssohn",
        "f mendelssohn": "Felix Mendelssohn",
        "weber": "Carl Maria von Weber",
        "c m weber": "Carl Maria von Weber",
        "cm weber": "Carl Maria von Weber",
        "carl maria von weber": "Carl Maria von Weber",
        "strauss": "Richard Strauss",
        "r strauss": "Richard Strauss",
        "richard strauss": "Richard Strauss",
        "tschaikowsky": "Peter Iljitsch Tschaikowsky",
        "tchaikovsky": "Peter Iljitsch Tschaikowsky",
        "dvorak": "Antonín Dvořák",
        "prokofjew": "Sergej Prokofjew",
        "prokofiev": "Sergej Prokofjew",
        "bartok": "Béla Bartók",
        "schostakowitsch": "Dimitri Schostakowitsch",
        "schostakowitschs": "Dimitri Schostakowitsch",
        "dmitri schostakowitsch": "Dimitri Schostakowitsch",
        "dimitri schostakowitsch": "Dimitri Schostakowitsch",
        "dmitrij schostakowitsch": "Dimitri Schostakowitsch",
        "shostakovich": "Dimitri Schostakowitsch",
        "dmitri shostakovich": "Dimitri Schostakowitsch",
        "dimitri shostakovich": "Dimitri Schostakowitsch",
        "dmitrij shostakovich": "Dimitri Schostakowitsch",
    };

    function canonicalComposerName(name) {
        const normalized = normalizeComposerAlias(name)
            .replace(/s$/, '');
        return COMPOSER_DISPLAY_NAMES[normalizeComposerAlias(name)] ||
            COMPOSER_DISPLAY_NAMES[normalized] ||
            name;
    }

    function normalizeComposerAlias(name) {
        return normalizeSearch(String(name || '')
            .replace(/\b([A-ZÄÖÜ])\./g, '$1 ')
            .replace(/\b([A-ZÄÖÜ])\s*\.?\s*([A-ZÄÖÜ])\./g, '$1 $2 '));
    }

    function enrichEvent(ev) {
        const mainWork = chooseMainWork(ev);
        return {
            ...ev,
            title: cleanEventTitle(ev.title, ev.url),
            mainWork,
        };
    }

    function cleanEventTitle(title, url = '') {
        let value = String(title || '').replace(/\s+/g, ' ').trim();
        value = value
            .replace(/\bFuenfte\b/g, 'Fünfte')
            .replace(/\bFuenfter\b/g, 'Fünfter')
            .replace(/\bFuer\b/g, 'Für')
            .replace(/\bHoeren\b/g, 'Hören')
            .replace(/\bKuenstler\b/g, 'Künstler')
            .replace(/\bMaerchen\b/g, 'Märchen');

        const pathPart = String(url || '').split('?')[0].replace(/\/$/, '').split('/').pop() || '';
        const urlSuffix = pathPart.match(/-(\d{1,5})$/)?.[1];
        if (urlSuffix && new RegExp(`\\s${urlSuffix}$`).test(value)) {
            value = value.replace(new RegExp(`\\s${urlSuffix}$`), '');
        }

        value = value.replace(/\b(\d{1,2})\s+(Philharmonisches|Meister|Abonnement|Afterwork|Konzert)\b/g, '$1. $2');
        value = value.replace(/\b(5)\s*Nachsechs\b/g, '$1nachsechs');
        value = value.replace(/^Bremer Philharmoniker\s+(.+?)\s+(\d{1,2}\.\s+Philharmonisches Konzert)$/i, 'Bremer Philharmoniker: $1 · $2');
        value = value.replace(/\s+([,.:;!?])/g, '$1').replace(/\s+/g, ' ').trim();
        return value;
    }

    function chooseMainWork(ev) {
        const works = (ev.program || [])
            .map((entry, index) => parseProgramEntry(entry, index, ev.title))
            .filter(Boolean)
            .sort((a, b) => b.score - a.score || a.index - b.index);
        return works[0] || null;
    }

    function parseProgramEntry(entry, index, eventTitle) {
        const raw = String(entry || '').trim();
        if (!raw || !raw.includes(':')) return null;
        const [composerRaw, ...rest] = raw.split(':');
        const composer = canonicalComposerName(composerRaw.trim());
        const workTitle = rest.join(':').trim();
        if (!composer || !workTitle) return null;
        return {
            composer,
            title: cleanProgramTitle(workTitle),
            label: `${composer}: ${cleanProgramTitle(workTitle)}`,
            score: mainWorkScore(composer, workTitle, index, eventTitle),
            index,
        };
    }

    function cleanProgramTitle(title) {
        return String(title || '')
            .replace(/\bSymphony\s+No\.?\s*/gi, 'Sinfonie Nr. ')
            .replace(/\bSymphony\b/gi, 'Sinfonie')
            .replace(/\bClarinet\s+Concerto\s+No\.?\s*/gi, 'Klarinettenkonzert Nr. ')
            .replace(/\bPiano\s+Concerto\s+No\.?\s*/gi, 'Klavierkonzert Nr. ')
            .replace(/\bViolin\s+Concerto\s+No\.?\s*/gi, 'Violinkonzert Nr. ')
            .replace(/\bCello\s+Concerto\s+No\.?\s*/gi, 'Cellokonzert Nr. ')
            .replace(/\bConcerto\s+No\.?\s*/gi, 'Konzert Nr. ')
            .replace(/\bNo\.?\s*/g, 'Nr. ')
            .replace(/\bin\s+B\s+Minor\b/gi, 'in h-Moll')
            .replace(/\bin\s+C\s+Major\b/gi, 'in C-Dur')
            .replace(/\bin\s+F\s+Minor\b/gi, 'in f-Moll')
            .replace(/\bin\s+A\s+Major\b/gi, 'in A-Dur')
            .replace(/\bin\s+D\s+Major\b/gi, 'in D-Dur')
            .replace(/\bin\s+D\s+Minor\b/gi, 'in d-Moll')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function mainWorkScore(composer, title, index, eventTitle) {
        const text = normalizeSearch(`${composer} ${title}`);
        const eventText = normalizeSearch(eventTitle);
        let score = 20 - index * 4;
        if (/\b(symphonie|sinfonie|symphony)\b/.test(text)) score += 120;
        if (/\b(klavierkonzert|violinkonzert|cellokonzert|bratschenkonzert)\b/.test(text)) score += 92;
        else if (/\b(konzert|concerto)\b/.test(text)) score += 72;
        if (/\b(oper|requiem|messe|oratorium|passion)\b/.test(text)) score += 82;
        if (/\b(sonate|quartett|quintett|sextett|trio)\b/.test(text)) score += 50;
        if (/\b(ouvertuere|ouverture|suite|variation|variationen)\b/.test(text)) score += 30;
        if (/\b(nr|no|op|opus|kv|bwv|hob|d)\s*\d+\b/.test(text)) score += 18;
        if (eventText.includes(normalizeSearch(composer))) score += 30;
        if (/\b(fuenfte|funfte|fünfte|5)\b/.test(eventText) && /\b(symphonie|sinfonie|symphony).*\b5\b|\b5\b.*\b(symphonie|sinfonie|symphony)\b/.test(text)) score += 90;
        if (/\b(masquerade|finlandia|vorspiel|prelude)\b/.test(text)) score -= 20;
        return score;
    }

    function composerQueryFor(query) {
        const normalizedQuery = normalizeSearch(query);
        const candidates = new Map();
        for (const [alias, display] of Object.entries(COMPOSER_DISPLAY_NAMES)) {
            candidates.set(normalizeSearch(alias), display);
            candidates.set(normalizeSearch(display), display);
        }
        for (const [candidate, display] of candidates) {
            if (candidate && normalizedQuery.includes(candidate)) return display;
        }
        return null;
    }

    function composerQueryTerms(query) {
        const composer = composerQueryFor(query);
        return composer ? new Set(normalizeSearch(composer).split(' ')) : new Set();
    }

    const dateFormatter = new Intl.DateTimeFormat('de-DE', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
    });

    function formatDate(isoDate) {
        const [year, month, day] = isoDate.split('-').map(Number);
        return dateFormatter.format(new Date(year, month - 1, day));
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;',
        }[char]));
    }

    function normalizeSearch(value) {
        return String(value ?? '')
            .toLowerCase()
            .replace(/ß/g, 'ss')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim()
            .replace(/\s+/g, ' ');
    }

    function eventSearchFields(ev) {
        return {
            title: normalizeSearch(ev.title),
            program: normalizeSearch((ev.program || []).join(' ')),
            performers: normalizeSearch((ev.performers || []).join(' ')),
            venue: normalizeSearch([ev.venue, ev.city, ev.hall].filter(Boolean).join(' ')),
            conductor: normalizeSearch(ev.conductor || ''),
        };
    }

    EVENTS = RAW_EVENTS.map(enrichEvent);

    const SEARCH_INDEX = EVENTS.map(ev => {
        const fields = eventSearchFields(ev);
        return {
            ev,
            fields,
            text: Object.values(fields).join(' '),
        };
    });

    function expandTerm(term) {
        const normalized = normalizeSearch(term);
        const aliases = SEARCH_ALIASES[normalized] || [];
        return Array.from(new Set([normalized, ...aliases.map(normalizeSearch)].filter(Boolean)));
    }

    function queryTerms(query) {
        return normalizeSearch(query)
            .split(' ')
            .filter(term => term.length > 1 || /^\d+$/.test(term))
            .map(term => {
                const alternatives = expandTerm(term);
                const numericAlias = alternatives.find(value => /^\d+$/.test(value));
                return {
                    raw: numericAlias || term,
                    numeric: Boolean(numericAlias) || /^\d+$/.test(term),
                    alternatives,
                };
            });
    }

    function includesAny(text, alternatives) {
        return alternatives.some(term => text.includes(term));
    }

    function numberMatches(text, number) {
        const escaped = String(number).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const patterns = [
            new RegExp(`\\b(nr|no|number|op|opus|kv|bwv|hob) ${escaped}\\b`),
            new RegExp(`\\b${escaped} (symphonie|sinfonie|symphony|konzert|concerto|quartett|quartet|sonate)\\b`),
            new RegExp(`\\b(symphonie|sinfonie|symphony|konzert|concerto|quartett|quartet|sonate) (nr |no |number )?${escaped}\\b`),
        ];
        return patterns.some(pattern => pattern.test(text));
    }

    function symphonyNumberMatches(text, number) {
        const escaped = String(number).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`\\b(symphonie|sinfonie|symphony) (nr |no |number )?${escaped}\\b`).test(text) ||
            new RegExp(`\\b${escaped} (symphonie|sinfonie|symphony)\\b`).test(text);
    }

    function scoreSearchItem(item, query) {
        const normalizedQuery = normalizeSearch(query);
        if (!normalizedQuery) return eventQuality(item.ev);

        const terms = queryTerms(query);
        if (!terms.length) return eventQuality(item.ev);

        let score = 0;
        const fieldWeights = [
            ['title', 34],
            ['program', 40],
            ['performers', 22],
            ['conductor', 18],
            ['venue', 14],
        ];

        for (const term of terms) {
            let matched = false;
            for (const [field, weight] of fieldWeights) {
                const fieldText = item.fields[field];
                const fieldMatched = term.numeric
                    ? numberMatches(fieldText, term.raw)
                    : includesAny(fieldText, term.alternatives);
                if (fieldMatched) {
                    matched = true;
                    score += weight;
                    if (field === 'program') score += 10;
                }
            }
            if (!matched) return 0;
        }

        if (item.text.includes(normalizedQuery)) score += 60;
        if (item.fields.title.includes(normalizedQuery)) score += 80;
        if (item.fields.program.includes(normalizedQuery)) score += 70;

        const hasWorkWord = WORK_WORDS.some(word => item.text.includes(word));
        const queryHasComposer = terms.some(term =>
            ['brahms', 'beethoven', 'mahler', 'mozart', 'bach', 'schubert', 'schumann', 'mendelssohn', 'tschaikowsky', 'tchaikovsky', 'dvorak'].includes(term.raw)
        );
        const queryHasNumber = terms.some(term => term.numeric);
        if (queryHasComposer && queryHasNumber && hasWorkWord) score += 55;
        if (queryHasComposer && queryHasNumber) {
            const composerTerms = terms
                .filter(term => !term.numeric)
                .flatMap(term => term.alternatives);
            const numberTerms = terms.filter(term => term.numeric).map(term => term.raw);
            const composerInProgram = composerTerms.some(term => item.fields.program.includes(term));
            const composerInTitle = composerTerms.some(term => item.fields.title.includes(term));
            const symphonyNumberInProgram = numberTerms.some(number => symphonyNumberMatches(item.fields.program, number));
            const symphonyNumberInTitle = numberTerms.some(number => symphonyNumberMatches(item.fields.title, number));
            if (composerInProgram && symphonyNumberInProgram) score += 180;
            if (composerInTitle && symphonyNumberInTitle) score += 90;
        }

        return score + eventQuality(item.ev) * 4;
    }

    function searchEvents(source, query) {
        const allowed = new Set(source);
        return SEARCH_INDEX
            .filter(item => allowed.has(item.ev))
            .map(item => ({ ev: item.ev, score: scoreSearchItem(item, query) }))
            .filter(result => result.score > 0)
            .sort((a, b) =>
                b.score - a.score ||
                a.ev.date.localeCompare(b.ev.date) ||
                (a.ev.time || '99:99').localeCompare(b.ev.time || '99:99')
            )
            .map(result => result.ev);
    }

    function dateRangeForQuery(query) {
        const normalized = normalizeSearch(query);
        if (!normalized.includes('diese woche') && !normalized.includes('this week')) return null;
        const firstDate = EVENTS.reduce((min, ev) => ev.date < min ? ev.date : min, EVENTS[0]?.date || '2026-05-21');
        const [year, month, day] = firstDate.split('-').map(Number);
        const end = new Date(year, month - 1, day + 7);
        const endIso = [
            end.getFullYear(),
            String(end.getMonth() + 1).padStart(2, '0'),
            String(end.getDate()).padStart(2, '0'),
        ].join('-');
        return { start: firstDate, end: endIso };
    }

    function stripDateShortcut(query) {
        return query.replace(/diese\s+woche/ig, '').replace(/this\s+week/ig, '').trim();
    }

    function shortList(items, fallback) {
        if (!items || !items.length) return fallback;
        return items.slice(0, 3).map(escapeHtml).join(' · ') + (items.length > 3 ? ' · ...' : '');
    }

    function programPreview(ev) {
        const program = (ev.program || []).map(formatProgramEntry);
        if (ev.mainWork?.label) {
            const mainIndex = program.findIndex(entry => programEntryMatchesMain(entry, ev.mainWork));
            if (mainIndex > 0) {
                const [main] = program.splice(mainIndex, 1);
                program.unshift(main);
            }
        }
        return shortList(program, escapeHtml(ev.hall || ev.venue));
    }

    function plainShortList(items, fallback) {
        if (!items || !items.length) return fallback;
        return items.slice(0, 4).map(escapeHtml).join(' · ') + (items.length > 4 ? ' · ...' : '');
    }

    function plainProgramPreview(ev) {
        const program = (ev.program || []).map(formatProgramEntry);
        if (ev.mainWork?.label) {
            const mainIndex = program.findIndex(entry => programEntryMatchesMain(entry, ev.mainWork));
            if (mainIndex > 0) {
                const [main] = program.splice(mainIndex, 1);
                program.unshift(main);
            }
        }
        return plainShortList(program, escapeHtml(ev.hall || ev.venue));
    }

    function programEntryMatchesMain(entry, mainWork) {
        const entryText = normalizeSearch(entry);
        const titleText = normalizeSearch(mainWork?.title || '');
        const composerText = normalizeSearch(mainWork?.composer || '').split(' ').pop();
        return Boolean(
            titleText && entryText.includes(titleText) ||
            composerText && entryText.includes(composerText) && titleText.split(' ').some(part => part.length > 3 && entryText.includes(part))
        );
    }

    function formatProgramEntry(entry) {
        const raw = String(entry || '').trim();
        if (!raw.includes(':')) return cleanProgramTitle(raw);
        const [composerRaw, ...rest] = raw.split(':');
        const composer = canonicalComposerName(composerRaw.trim());
        const title = cleanProgramTitle(rest.join(':').trim());
        return `${composer}: ${title}`;
    }

    function composerFromProgram(ev) {
        if (ev.mainWork?.composer) return ev.mainWork.composer;
        const text = (ev.program && ev.program[0]) || ev.title || ev.venue;
        const match = String(text).match(/^([^:·-]{3,28})[:·-]/);
        return match ? canonicalComposerName(match[1].trim()) : ev.city;
    }

    function badgeFor(ev) {
        if (ev.program && ev.program.length) return { label: 'Programm', kind: 'programm' };
        if (ev.performers && ev.performers.length) return { label: 'Besetzung', kind: 'besetzung' };
        return { label: ev.city, kind: 'city' };
    }

    // Gedeckte Cover-Palette; Farbe deterministisch aus dem Komponisten,
    // damit derselbe Name immer denselben Ton bekommt.
    const COVER_PALETTE = ['#102251', '#4E1B1B', '#3D1840', '#4C3818', '#271F49', '#42202A'];
    function coverColor(name) {
        const key = (name || '').trim().toLowerCase();
        let h = 0;
        for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
        return COVER_PALETTE[h % COVER_PALETTE.length];
    }

    function eventQuality(ev) {
        return Number(Boolean(ev.program && ev.program.length)) +
            Number(Boolean(ev.performers && ev.performers.length)) +
            Number(Boolean(ev.hall)) +
            Number(Boolean(ev.conductor));
    }

    function fivePerVenue() {
        return VENUES.flatMap(venue => EVENTS
            .filter(ev => ev.slug === venue.slug)
            .slice()
            .sort((a, b) =>
                eventQuality(b) - eventQuality(a) ||
                a.date.localeCompare(b.date) ||
                (a.time || '99:99').localeCompare(b.time || '99:99')
            )
            .slice(0, 5)
        );
    }

    function applyFilterState(events) {
        return events.filter(ev => {
            if (filterState.from && ev.date < filterState.from) return false;
            if (filterState.to && ev.date > filterState.to) return false;
            if (filterState.cities.length && !filterState.cities.includes(ev.city)) return false;
            return true;
        });
    }

    function getFilteredEvents() {
        const q = document.getElementById('q').value.trim();
        const dateRange = dateRangeForQuery(q);
        const cleanQuery = stripDateShortcut(q);
        const hasFilters = hasActiveFilters();
        const source = (!showAllEvents && !activeVenue && !q && !hasFilters) ? fivePerVenue() : EVENTS;
        const scoped = source.filter(ev => {
            if (activeVenue && ev.slug !== activeVenue) return false;
            if (dateRange && (ev.date < dateRange.start || ev.date > dateRange.end)) return false;
            return true;
        });
        const filtered = applyFilterState(scoped);
        return cleanQuery ? searchEvents(filtered, cleanQuery) : filtered;
    }

    async function fetchSuggestions(query) {
        const q = query.trim();
        if (!q) return [];
        const seq = ++searchRequestSeq;
        try {
            const res = await fetch(`${SEARCH_API}?q=${encodeURIComponent(q)}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            // Only honour the freshest request — older ones still inflight
            // when a newer one was issued are discarded.
            if (seq !== searchRequestSeq) return null;
            return data.suggestions || [];
        } catch (err) {
            if (seq !== searchRequestSeq) return null;
            console.warn('search failed', err);
            return [];
        }
    }

    function buildEventBackedSuggestions(query, limit = 8) {
        const composerSuggestions = buildComposerSuggestionsFromEvents(query, 3);
        const workSuggestions = searchEvents(EVENTS, query)
            .flatMap(ev => (ev.program || []).map(work => ({ ev, work })))
            .filter(item => scoreWork(item.work, query) > 0)
            .slice(0, limit)
            .map(item => ({
                kind: 'Werk',
                label: item.work,
                sub: `${item.ev.venue} · aktueller Termin`,
                value: item.work,
            }));
        const seen = new Set();
        return [...composerSuggestions, ...workSuggestions].filter(suggestion => {
            const key = normalizeSearch(suggestion.value);
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        }).slice(0, limit);
    }

    function buildComposerSuggestionsFromEvents(query, limit = 3) {
        const composers = new Map();
        for (const ev of EVENTS) {
            for (const entry of ev.program || []) {
                const composer = composerFromWork(entry);
                if (!composer) continue;
                const score = scoreComposer(composer, query);
                if (!score) continue;
                const key = normalizeSearch(composer);
                const current = composers.get(key) || { composer, score: 0, count: 0 };
                current.score = Math.max(current.score, score);
                current.count += 1;
                composers.set(key, current);
            }
        }
        return Array.from(composers.values())
            .sort((a, b) => b.score - a.score || b.count - a.count)
            .slice(0, limit)
            .map(item => ({
                kind: 'Komponist',
                label: item.composer,
                sub: `${item.count} aktuelle Termine`,
                value: item.composer,
            }));
    }

    function composerFromWork(work) {
        const raw = String(work || '').split(':')[0]?.trim();
        if (!raw || raw.length < 3) return null;
        if (/^(various|uraufführung|basso continuo|pause)$/i.test(raw)) return null;
        return canonicalComposerName(raw);
    }

    function scoreComposer(composer, query) {
        const normalized = normalizeSearch(composer);
        const terms = queryTerms(query).filter(term => !term.numeric);
        if (!terms.length) return 0;
        let score = 0;
        for (const term of terms) {
            if (!includesAny(normalized, term.alternatives)) return 0;
            score += 50;
        }
        if (normalized.split(' ').some(part => part.startsWith(normalizeSearch(query)))) score += 70;
        if (Object.values(COMPOSER_DISPLAY_NAMES).some(name => normalizeSearch(name) === normalized)) score += 90;
        return score;
    }

    function buildComposerSuggestions(query, limit = 5) {
        if (!KLASSIKA_COMPOSERS.length) return [];
        const qNorm = normalizeSearch(query);
        if (!qNorm) return [];
        const qTerms = qNorm.split(' ').filter(Boolean);
        if (!qTerms.length) return [];

        const scored = [];
        for (const c of KLASSIKA_COMPOSERS) {
            const slug = c.slug;
            let score = 0;
            let allMatched = true;
            for (const term of qTerms) {
                if (!slug.includes(term)) { allMatched = false; break; }
                score += 30;
                const parts = slug.split(' ');
                if (parts.some(p => p.startsWith(term))) score += 20;
                if (parts.some(p => p === term)) score += 35;
            }
            if (!allMatched) continue;
            if (slug === qNorm) score += 200;
            else if (slug.startsWith(qNorm)) score += 80;
            else if (slug.split(' ').pop().startsWith(qNorm)) score += 60;

            // Relevance boost: current events dominate, works count is a
            // secondary signal (capped so sheer prolificness doesn't overwhelm
            // close name matches).
            const events = eventCountFor(c.name);
            score += events * 1000;
            score += Math.min(c.works || 0, 500);
            scored.push({ c, score, eventCount: events });
        }

        return scored
            .sort((a, b) => b.score - a.score || a.c.name.localeCompare(b.c.name))
            .slice(0, limit)
            .map(({ c, eventCount: events }) => {
                const sub = events
                    ? `${events.toLocaleString('de-DE')} ${events === 1 ? 'aktueller Termin' : 'aktuelle Termine'}`
                    : `0 aktuelle Termine · Benachrichtigung einrichten`;
                return {
                    kind: 'Komponist',
                    label: c.name,
                    sub,
                    value: c.name,
                    eventCount: events,
                    composerSlug: c.slug,
                };
            });
    }

    function scoreWork(work, query) {
        const normalized = normalizeSearch(work);
        const terms = queryTerms(query);
        if (!terms.length) return 0;
        const workComposer = composerFromWork(work);
        const queryComposer = composerQueryFor(query);
        const queryComposerTerms = composerQueryTerms(query);
        const composerMatches = queryComposer && workComposer &&
            normalizeSearch(canonicalComposerName(workComposer)) === normalizeSearch(queryComposer);
        let score = 0;
        for (const term of terms) {
            const matched = term.numeric
                ? numberMatches(normalized, term.raw)
                : includesAny(normalized, term.alternatives) ||
                    (composerMatches && queryComposerTerms.has(term.raw));
            if (!matched) return 0;
            score += term.numeric ? 32 : 24;
        }
        if (composerMatches) score += 120;
        const numberTerm = terms.find(term => term.numeric);
        if (numberTerm && symphonyNumberMatches(normalized, numberTerm.raw)) score += 90;
        if (WORK_WORDS.some(word => normalized.includes(word))) score += 24;
        return score;
    }

    function buildWorkSuggestions(query, limit = 8) {
        const terms = queryTerms(query);
        const queryComposer = composerQueryFor(query);
        return KLASSIKA_WORKS
            .map(work => ({ work, score: scoreCatalogWork(work, query, terms, queryComposer) }))
            .filter(item => item.score > 0)
            .sort((a, b) =>
                (b.work.eventUrls || []).length - (a.work.eventUrls || []).length ||
                b.score - a.score ||
                a.work.label.localeCompare(b.work.label)
            )
            .slice(0, limit)
            .map(item => {
                const eventCount = (item.work.eventUrls || []).length;
                const rawGenre = (item.work.genre || '').trim();
                const genre = (!rawGenre || rawGenre.toLowerCase() === 'crawl') ? '' : rawGenre;
                const eventLabel = eventCount
                    ? `${eventCount} ${eventCount === 1 ? 'aktueller Termin' : 'aktuelle Termine'}`
                    : `0 aktuelle Termine · Benachrichtigung einrichten`;
                const sub = genre ? `${eventLabel} · ${genre}` : eventLabel;
                return {
                    kind: 'Werk',
                    label: item.work.label,
                    sub,
                    value: item.work.label,
                    workId: item.work.id,
                    workLabel: item.work.label,
                    workComposer: item.work.composer || '',
                    eventCount,
                };
            });
    }

    function scoreCatalogWork(work, query, preparedTerms = null, preparedComposer = undefined) {
        const haystack = `${work.search || ''} ${normalizeSearch(work.label)}`;
        const terms = preparedTerms || queryTerms(query);
        if (!terms.length) return 0;
        const queryComposer = preparedComposer === undefined ? composerQueryFor(query) : preparedComposer;
        let score = 0;
        for (const term of terms) {
            const matched = term.numeric
                ? numberMatches(haystack, term.raw)
                : includesAny(haystack, term.alternatives) ||
                    (queryComposer && normalizeSearch(work.composer) === normalizeSearch(queryComposer));
            if (!matched) return 0;
            score += term.numeric ? 40 : 26;
        }
        if (queryComposer && normalizeSearch(work.composer) === normalizeSearch(queryComposer)) score += 120;
        const numberTerm = terms.find(term => term.numeric);
        if (numberTerm && symphonyNumberMatches(haystack, numberTerm.raw)) score += 100;
        if ((work.eventUrls || []).length) score += 45;
        return score;
    }

    function renderSuggestions() {
        const q = document.getElementById('q').value;
        if (!q.trim()) {
            currentSuggestions = [];
            renderSuggestionsDOM();
            return;
        }
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(async () => {
            const result = await fetchSuggestions(q);
            if (result === null) return; // superseded
            currentSuggestions = result;
            activeSuggestion = Math.min(activeSuggestion, currentSuggestions.length - 1);
            renderSuggestionsDOM();
        }, 120);
    }

    function renderSuggestionsDOM() {
        const el = document.getElementById('suggestions');
        if (!currentSuggestions.length) {
            el.classList.remove('is-open');
            document.getElementById('hero').classList.remove('suggestions-open');
            el.innerHTML = '';
            return;
        }
        el.innerHTML = currentSuggestions.map((suggestion, index) => `
            <button type="button" class="suggestion ${index === activeSuggestion ? 'is-active' : ''}" role="option" onclick="chooseSuggestion(${index}, { search: true })">
                <span class="suggestion-kind">${escapeHtml(suggestion.kind)}</span>
                <span class="suggestion-main">${escapeHtml(suggestion.label)}</span>
                <span class="suggestion-sub">${escapeHtml(suggestion.sub)}</span>
            </button>
        `).join('');
        el.classList.add('is-open');
    }

    function chooseSuggestion(index, options = {}) {
        const suggestion = currentSuggestions[index];
        if (!suggestion) return;
        if (suggestion.kind === 'Komponist' && suggestion.eventCount === 0) {
            window.location.href = `./notify.html?composer=${encodeURIComponent(suggestion.value)}`;
            return;
        }
        if (suggestion.kind === 'Werk' && suggestion.eventCount === 0) {
            const params = new URLSearchParams({ work: suggestion.workLabel || suggestion.value });
            if (suggestion.workComposer) params.set('composer', suggestion.workComposer);
            window.location.href = `./notify.html?${params.toString()}`;
            return;
        }
        document.getElementById('q').value = suggestion.value;
        document.getElementById('suggestions').classList.remove('is-open');
        document.getElementById('hero').classList.remove('suggestions-open');
        activeSuggestion = -1;
        activeVenue = null;
        showAllEvents = true;
        visibleLimit = 65;
        if (options.search) {
            doSearch();
        } else {
            renderSuggestions();
        }
    }

    function acceptSuggestion(index, options = {}) {
        const suggestion = currentSuggestions[index];
        if (!suggestion) return;
        const input = document.getElementById('q');
        input.value = suggestion.value + (options.appendSpace ? ' ' : '');
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        activeSuggestion = -1;
        renderSuggestions();
    }

    function renderSearchResults(query) {
        const baseEvents = query ? searchEvents(EVENTS, query) : [...EVENTS].sort((a, b) => a.date.localeCompare(b.date));
        const results = applyFilterState(baseEvents);
        document.body.classList.add('is-results');
        const filterParts = [];
        if (filterState.cities.length) filterParts.push(cityFilterLabel());
        if (filterState.from || filterState.to) {
            const f = filterState.from ? new Date(filterState.from + 'T00:00:00').toLocaleDateString('de-DE') : '…';
            const t = filterState.to ? new Date(filterState.to + 'T00:00:00').toLocaleDateString('de-DE') : '…';
            filterParts.push(`${f} bis ${t}`);
        }
        const filterSummary = filterParts.length ? filterParts.join(' · ') : '';
        const titleText = query
            ? `Suche: ${query}${filterSummary ? ' · ' + filterSummary : ''}`
            : (filterSummary || 'Konzerte');
        document.title = `${query || filterSummary || 'Konzerte'} — Nachtmusik`;
        document.getElementById('q').value = query;
        document.getElementById('search-title').textContent = titleText;
        document.getElementById('search-count').textContent = `${results.length.toLocaleString('de-DE')} passende Konzerte`;
        document.getElementById('results-list').innerHTML = results.length
            ? results.map(ev => `
                <a class="result-row" href="${escapeHtml(ev.url)}" target="_blank" rel="noopener">
                    <div>
                        <div class="result-date">${formatDate(ev.date)}</div>
                        <div class="result-time">${escapeHtml(ev.time || 'Uhrzeit offen')}</div>
                    </div>
                    <div>
                        <div class="result-title">${escapeHtml(ev.title)}</div>
                        <div class="result-program">${plainProgramPreview(ev)}</div>
                    </div>
                    <div class="result-venue">
                        <strong>${escapeHtml(ev.venue)}</strong>
                        ${escapeHtml(ev.city)}${ev.hall ? ` · ${escapeHtml(ev.hall)}` : ''}
                    </div>
                </a>
            `).join('')
            : `<div class="empty-state">
                <strong>Keine aktuellen Konzerte gefunden.</strong>
                <a class="notify-soon" href="./notify.html?q=${encodeURIComponent(query)}">🔔 Benachrichtigen lassen</a>
                <span class="notify-note">Wir melden uns, sobald ein passender Termin angekündigt wird.</span>
            </div>`;
    }

    function renderStartPage() {
        document.body.classList.remove('is-results');
        document.title = 'nachtmusik — klassische Konzerte entdecken';
        renderGrid();
        renderVenues();
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        const filtered = getFilteredEvents();
        const shown = filtered.slice(0, visibleLimit);
        document.getElementById('results-title').textContent =
            activeVenue
                ? `${VENUES.find(v => v.slug === activeVenue)?.name || 'Haus'} · ${filtered.length} Events`
                : showAllEvents
                    ? `Alle Events · ${filtered.length} Events`
                    : 'Nachtmusik Picks';
        grid.innerHTML = shown.map(ev => {
            const composerName = composerFromProgram(ev);
            const initial = (composerName.match(/[A-Za-zÀ-ÿ]/)?.[0] || '♪').toUpperCase();
            const badge = badgeFor(ev);
            return `
            <article class="tile" onclick="window.open('${escapeHtml(ev.url)}', '_blank', 'noopener')">
                <div class="tile-cover" data-initial="${escapeHtml(initial)}" style="--cover:${coverColor(composerName)}">
                    <div class="badge-tile badge-${badge.kind}">${escapeHtml(badge.label)}</div>
                    <div class="composer">${escapeHtml(composerName)}</div>
                    <div class="price">${escapeHtml(ev.city)}</div>
                </div>
                <div class="tile-body">
                    <div class="tile-meta">
                        <span class="meta-date">${formatDate(ev.date)}</span>
                        <span class="meta-time">${ev.time || 'Uhrzeit offen'}</span>
                        <span class="meta-venue">${escapeHtml(ev.venue)}</span>
                    </div>
                    <div class="tile-title">${escapeHtml(ev.title)}</div>
                    <div class="tile-prog">${programPreview(ev)}</div>
                    <div class="tile-perf">
                        <strong>${shortList(ev.performers, 'Besetzung offen')}</strong>${ev.conductor ? ` · Ltg. ${escapeHtml(ev.conductor)}` : ''}
                    </div>
                </div>
            </article>
        `;
        }).join('');
        if (!shown.length) {
            grid.innerHTML = `<div class="empty-state">Keine passenden Events gefunden.</div>`;
        }
        revealTiles(grid);
    }

    // Gestaffeltes Einblenden der Kacheln. Garantie: kann das Reveal nicht
    // sicher gefeuert werden (kein IO, reduzierte Bewegung), bleibt alles
    // sofort sichtbar; ein Timer hebt jedes "pending" spätestens auf.
    function revealTiles(grid) {
        const tiles = grid.querySelectorAll('.tile');
        if (!tiles.length) return;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce || !('IntersectionObserver' in window)) return;

        if (!grid.dataset.revealBound) {
            grid.dataset.revealBound = '1';
            grid.addEventListener('animationend', e => {
                if (e.animationName === 'tile-rise') e.target.classList.remove('reveal-shown');
            });
        }

        let fired = false;
        const io = new IntersectionObserver((entries, obs) => {
            fired = true;
            const shown = entries.filter(e => e.isIntersecting);
            shown.forEach((entry, i) => {
                const tile = entry.target;
                obs.unobserve(tile);
                tile.style.animationDelay = (i * 55) + 'ms';
                tile.classList.remove('reveal-pending');
                tile.classList.add('reveal-shown');
            });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });

        tiles.forEach(t => { t.classList.add('reveal-pending'); io.observe(t); });

        // Sicherheitsnetz nur für den echten Ausfall: feuert der Observer
        // GAR NICHT (Headless/Hidden-Tab), alles sichtbar machen. Feuert er
        // normal, übernimmt er das Reveal für ALLE Kacheln beim Scrollen.
        setTimeout(() => {
            if (fired) return;
            io.disconnect();
            tiles.forEach(t => t.classList.remove('reveal-pending'));
        }, 1500);
    }

    function renderVenues() {
        const el = document.getElementById('venues');
        el.innerHTML = VENUES.map(v => `
            <a class="venue-chip ${activeVenue === v.slug ? 'is-active' : ''}" href="#" onclick="filterVenue('${v.slug}'); return false;">
                <div class="v-city">${escapeHtml(v.city)} · ${v.count}</div>
                <div class="v-name">${escapeHtml(v.name)}</div>
            </a>
        `).join('');
    }

    function setQuery(q) {
        document.getElementById('q').value = q;
        document.getElementById('q').focus();
        document.getElementById('suggestions').classList.remove('is-open');
        doSearch();
    }

    (function setupNavMenu() {
        const btn = document.getElementById('nav-menu-btn');
        const menu = document.getElementById('nav-menu');
        if (!btn || !menu) return;
        function close() {
            menu.classList.remove('is-open');
            btn.setAttribute('aria-expanded', 'false');
            menu.setAttribute('aria-hidden', 'true');
            btn.setAttribute('aria-label', 'Menü öffnen');
        }
        function open() {
            menu.classList.add('is-open');
            btn.setAttribute('aria-expanded', 'true');
            menu.setAttribute('aria-hidden', 'false');
            btn.setAttribute('aria-label', 'Menü schließen');
        }
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.contains('is-open') ? close() : open();
        });
        document.addEventListener('click', (e) => {
            if (!menu.classList.contains('is-open')) return;
            if (menu.contains(e.target) || btn.contains(e.target)) return;
            close();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') close();
        });
    })();

    function doSearch() {
        document.getElementById('suggestions').classList.remove('is-open');
        document.getElementById('hero').classList.remove('suggestions-open');
        const q = document.getElementById('q').value.trim();
        const hasFilters = hasActiveFilters();
        if (!q && !hasFilters) return;
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (filterState.from) params.set('from', filterState.from);
        if (filterState.to) params.set('to', filterState.to);
        filterState.cities.forEach(city => params.append('city', city));
        window.location.href = `./home.html?${params.toString()}`;
    }

    const filterState = {
        from: '',
        to: '',
        cities: [],
    };

    function hasActiveFilters() {
        return Boolean(filterState.from || filterState.to || filterState.cities.length);
    }

    function cityFilterLabel() {
        if (!filterState.cities.length) return '';
        if (filterState.cities.length === 1) return filterState.cities[0];
        return `${filterState.cities.length} Städte`;
    }

    (function setupSearchFilters() {
        const btnZeitraum = document.getElementById('btn-zeitraum');
        const btnStadt = document.getElementById('btn-stadt');
        const popZeit = document.getElementById('popover-zeitraum');
        const popStadt = document.getElementById('popover-stadt');
        const labelZeit = document.getElementById('btn-zeitraum-label');
        const labelStadt = document.getElementById('btn-stadt-label');
        const inputFrom = document.getElementById('filter-from');
        const inputTo = document.getElementById('filter-to');
        const citiesContainer = document.getElementById('filter-cities');
        if (!btnZeitraum || !btnStadt) return;

        const params = new URLSearchParams(window.location.search);
        filterState.from = params.get('from') || '';
        filterState.to = params.get('to') || '';
        const cityParams = params.getAll('city');
        const legacyCityParam = cityParams.length === 1 && cityParams[0].includes(',')
            ? cityParams[0].split(',')
            : cityParams;
        filterState.cities = Array.from(new Set(
            legacyCityParam.map(city => city.trim()).filter(Boolean)
        ));

        function formatDateShort(iso) {
            if (!iso) return '';
            const d = new Date(iso + 'T00:00:00');
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        }
        function updateLabels() {
            if (filterState.from || filterState.to) {
                const a = formatDateShort(filterState.from) || '…';
                const b = formatDateShort(filterState.to) || '…';
                labelZeit.textContent = `${a} – ${b}`;
                btnZeitraum.classList.add('has-value');
            } else {
                labelZeit.textContent = 'Zeitraum';
                btnZeitraum.classList.remove('has-value');
            }
            if (filterState.cities.length) {
                labelStadt.textContent = cityFilterLabel();
                btnStadt.classList.add('has-value');
            } else {
                labelStadt.textContent = 'Stadt';
                btnStadt.classList.remove('has-value');
            }
        }

        const uniqueCities = Array.from(new Set(
            RAW_EVENTS.map(e => e && e.city).filter(Boolean)
        )).sort((a, b) => a.localeCompare(b, 'de'));
        function renderCities() {
            const selectedCities = new Set(filterState.cities);
            citiesContainer.innerHTML = uniqueCities.map(c =>
                `<button type="button" data-city="${escapeHtml(c)}" aria-pressed="${selectedCities.has(c) ? 'true' : 'false'}"${selectedCities.has(c) ? ' class="is-selected"' : ''}>${escapeHtml(c)}</button>`
            ).join('');
        }
        renderCities();
        citiesContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-city]');
            if (!btn) return;
            const c = btn.dataset.city;
            filterState.cities = filterState.cities.includes(c)
                ? filterState.cities.filter(city => city !== c)
                : [...filterState.cities, c];
            renderCities();
            updateLabels();
        });

        const todayIso = new Date().toISOString().slice(0, 10);
        inputFrom.min = todayIso;
        inputTo.min = todayIso;
        inputFrom.value = filterState.from;
        inputTo.value = filterState.to;
        function tryAutoApplyDates() {
            if (inputFrom.value && inputTo.value && inputTo.value >= inputFrom.value) {
                filterState.from = inputFrom.value;
                filterState.to = inputTo.value;
                updateLabels();
                closeAll();
                refreshView();
            }
        }
        inputFrom.addEventListener('change', () => {
            if (inputFrom.value) inputTo.min = inputFrom.value;
            tryAutoApplyDates();
        });
        inputTo.addEventListener('change', tryAutoApplyDates);

        function closeAll() {
            popZeit.hidden = true;
            popStadt.hidden = true;
            btnZeitraum.setAttribute('aria-expanded', 'false');
            btnStadt.setAttribute('aria-expanded', 'false');
            if (document.activeElement === inputFrom || document.activeElement === inputTo) {
                document.activeElement.blur();
            }
        }
        function openPopover(which) {
            closeAll();
            if (which === 'zeitraum') {
                popZeit.hidden = false;
                btnZeitraum.setAttribute('aria-expanded', 'true');
            } else {
                popStadt.hidden = false;
                btnStadt.setAttribute('aria-expanded', 'true');
            }
        }

        btnZeitraum.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (popZeit.hidden) openPopover('zeitraum');
            else closeAll();
        });
        btnStadt.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (popStadt.hidden) openPopover('stadt');
            else closeAll();
        });
        document.addEventListener('click', (e) => {
            if (popZeit.hidden && popStadt.hidden) return;
            if (popZeit.contains(e.target) || popStadt.contains(e.target)) return;
            if (btnZeitraum.contains(e.target) || btnStadt.contains(e.target)) return;
            closeAll();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });

        function refreshView() {
            if (document.body.classList.contains('is-results')) {
                const q = document.getElementById('q').value.trim();
                renderSearchResults(q);
            } else {
                renderGrid();
            }
        }

        document.querySelectorAll('.filter-apply').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.filter === 'zeitraum') {
                filterState.from = inputFrom.value;
                filterState.to = inputTo.value;
            }
            updateLabels();
            closeAll();
            refreshView();
        }));
        document.querySelectorAll('.filter-clear').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.filter === 'zeitraum') {
                filterState.from = '';
                filterState.to = '';
                inputFrom.value = '';
                inputTo.value = '';
            } else {
                filterState.cities = [];
                renderCities();
            }
            updateLabels();
            refreshView();
        }));

        updateLabels();
    })();

    function filterVenue(slug) {
        activeVenue = activeVenue === slug ? null : slug;
        showAllEvents = true;
        visibleLimit = 65;
        renderGrid();
        renderVenues();
        document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('q').addEventListener('input', () => {
        activeSuggestion = -1;
        updateClearButton();
        renderSuggestions();
    });

    function updateClearButton() {
        const btn = document.getElementById('clear-q');
        if (!btn) return;
        btn.hidden = !document.getElementById('q').value;
    }

    document.getElementById('clear-q').addEventListener('click', () => {
        const input = document.getElementById('q');
        input.value = '';
        updateClearButton();
        activeSuggestion = -1;
        renderSuggestions();
        input.focus();
    });
    updateClearButton();
    const mobileSearchMQ = window.matchMedia('(max-width: 640px)');
    document.getElementById('q').addEventListener('focus', () => {
        if (mobileSearchMQ.matches) {
            document.body.classList.add('is-searching-mobile');
            // Scroll the searchbox to the top of the viewport so the keyboard
            // doesn't push suggestions out of sight.
            requestAnimationFrame(() => {
                const box = document.querySelector('.searchbox');
                if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        }
        renderSuggestions();
    });
    document.getElementById('q').addEventListener('blur', () => {
        setTimeout(() => {
            document.getElementById('suggestions').classList.remove('is-open');
            document.getElementById('hero').classList.remove('suggestions-open');
            document.body.classList.remove('is-searching-mobile');
        }, 120);
    });
    document.getElementById('q').addEventListener('keydown', event => {
        if (!currentSuggestions.length) return;
        if (event.key === 'ArrowDown') {
            event.preventDefault();
            activeSuggestion = (activeSuggestion + 1) % currentSuggestions.length;
            renderSuggestionsDOM();
        }
        if (event.key === 'ArrowUp') {
            event.preventDefault();
            activeSuggestion = (activeSuggestion - 1 + currentSuggestions.length) % currentSuggestions.length;
            renderSuggestionsDOM();
        }
        if (event.key === 'Enter' && activeSuggestion >= 0) {
            event.preventDefault();
            chooseSuggestion(activeSuggestion, { search: true });
        }
        if (event.key === ' ' && activeSuggestion >= 0) {
            event.preventDefault();
            acceptSuggestion(activeSuggestion, { appendSpace: true });
        }
        if (event.key === 'Escape') {
            event.preventDefault();
            const input = document.getElementById('q');
            document.getElementById('suggestions').classList.remove('is-open');
            document.getElementById('hero').classList.remove('suggestions-open');
            document.body.classList.remove('is-searching-mobile');
            input.blur();
        }
    });
    document.getElementById('show-all').addEventListener('click', event => {
        event.preventDefault();
        showAllEvents = true;
        visibleLimit = EVENTS.length;
        renderGrid();
    });
    document.getElementById('event-count').textContent = EVENTS.length.toLocaleString('de-DE');
    document.getElementById('venue-count').textContent = VENUES.length.toLocaleString('de-DE');
    const initialQuery = new URLSearchParams(window.location.search).get('q');
    const hasInitialFilters = hasActiveFilters();
    if (initialQuery || hasInitialFilters) {
        renderSearchResults(initialQuery || '');
    } else {
        renderStartPage();
    }

    // Warm up the search function so the first keystroke isn't a cold start.
    if ('requestIdleCallback' in window) {
        window.requestIdleCallback(() => fetch('/api/search?q=').catch(() => {}), { timeout: 3500 });
    } else {
        window.setTimeout(() => fetch('/api/search?q=').catch(() => {}), 1800);
    }
</script>
</body>
</html>
