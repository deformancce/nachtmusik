name: Analyze Tier-1 venue sites

# Runs analyze_venues.py for all Tier-1 venues (or a specific subset).
# Uses crawl4ai + Claude to derive CSS selectors and writes:
#   - backend/scrape/venue_site_structures.json
#   - backend/scrape/configs/<slug>.py for each analyzed venue
# Both are committed back to the branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to analyze on and commit results to"
        required: false
        default: "main"
      slugs:
        description: "Space-separated venue slugs (empty = all Tier 1)"
        required: false
        default: ""
      force_configs:
        description: "Overwrite existing config files"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: analyze-venues
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet crawl4ai pydantic anthropic requests beautifulsoup4
          python3 -m playwright install --with-deps chromium

      - name: Run site analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            python3 -m backend.scrape.analyze_venues --only ${{ github.event.inputs.slugs }}
          else
            python3 -m backend.scrape.analyze_venues --tier 1
          fi

      - name: Regenerate configs from analysis results
        run: |
          if [ "${{ github.event.inputs.force_configs }}" = "true" ]; then
            python3 -m backend.scrape.generate_configs --force
          else
            python3 -m backend.scrape.generate_configs
          fi

      - name: Show summary
        run: |
          python3 -c "
          import json
          with open('backend/scrape/venue_site_structures.json') as f:
              data = json.load(f)
          for slug, v in data.items():
              print(f\"  [{v.get('validation','?'):14s}] confidence={v.get('confidence',0):.2f}  {slug}\")
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scrape/venue_site_structures.json backend/scrape/configs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh venue_site_structures.json + configs (analyzer run)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
