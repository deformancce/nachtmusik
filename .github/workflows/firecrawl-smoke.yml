name: Firecrawl scrape (Tier-0)

on:
  workflow_dispatch:
    inputs:
      max_events:
        description: "Zahl: Events pro Venue vollständig anreichern"
        required: false
        default: "5"
      mode:
        description: "Modus: scrape = Ergebnis-JSONs, probe = nur Discovery-Report"
        required: false
        default: "scrape"
      slugs:
        description: "Slug(s): optional, mit Leerzeichen getrennt; leer = alle Tier-0"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: firecrawl-smoke
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet firecrawl-py pydantic requests beautifulsoup4

      - name: Run Firecrawl scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MAX_EVENTS: ${{ github.event.inputs.max_events }}
          MODE: ${{ github.event.inputs.mode }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          ARGS=(--max-events "${MAX_EVENTS:-5}" --horizon-months 6 --skip-map)
          if [ "${MODE:-scrape}" = "probe" ]; then
            ARGS+=(--probe-discovery)
          fi
          if [ -n "$SLUGS" ]; then
            ARGS+=(--only $SLUGS)
          fi
          python3 -m backend.scrape.firecrawl_scraper "${ARGS[@]}"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/firecrawl_*_events.json 2>/dev/null || true
          git add backend/raw/ 2>/dev/null || true
          git add backend/probes/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Firecrawl results ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
