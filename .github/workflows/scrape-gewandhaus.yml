name: Scrape Gewandhaus events

# Manual trigger from the Actions tab, plus a daily schedule.
# The job fetches all 15 Gewandhaus category pages, parses concert events,
# and commits backend/gewandhaus_events.json back to the chosen branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scrape from and commit to"
        required: false
        default: "claude/add-opus-code-iSPrR"
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"

permissions:
  contents: write

# Scheduled runs default github.ref_name to the repo's default branch (main),
# not the feature branch — pin it here so cron uses the same code as manual runs.
concurrency:
  group: scrape-gewandhaus
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'claude/add-opus-code-iSPrR' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet requests beautifulsoup4 lxml playwright anthropic
          python3 -m playwright install --with-deps chromium

      - name: Run Gewandhaus scraper
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 scrape/gewandhaus_scraper.py --clicks 60

      - name: Show summary
        working-directory: backend
        run: |
          python3 -c "
          import json
          with open('gewandhaus_events.json') as f:
              data = json.load(f)
          total = data.get('total_events', len(data.get('events', [])))
          print(f'Total events: {total}')
          for e in data.get('events', [])[:5]:
              print(f\"  {e.get('date')} {e.get('time','')} {e.get('title','')[:60]}\")
          "

      - name: Upload debug HTML if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-detail-sample
          path: backend/_debug_detail_sample.html
          if-no-files-found: ignore

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/gewandhaus_events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh gewandhaus_events.json (automated scrape)"
            git push
          fi
