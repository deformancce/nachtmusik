name: Firecrawl probe (URL discovery)

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slug(s): mit Leerzeichen getrennt; leer = alle Tier-0"
        required: false
        default: "philharmonie_essen liederhalle_stuttgart tonhalle_duesseldorf"

permissions:
  contents: write

concurrency:
  group: firecrawl-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet firecrawl-py==4.27.1 pydantic requests beautifulsoup4

      - name: Check Firecrawl secret
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "FIRECRAWL_API_KEY secret is not available to this workflow run." >&2
            exit 1
          fi

      - name: Run Firecrawl discovery probe
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PYTHONUNBUFFERED: "1"
          SLUGS: ${{ github.event.inputs.slugs }}
          FIRECRAWL_MIN_DELAY_SECONDS: "1.0"
          FIRECRAWL_MAX_RETRIES: "3"
          FIRECRAWL_BACKOFF_SECONDS: "4.0"
        run: |
          ARGS=(--probe-discovery --horizon-months 6)
          if [ -n "$SLUGS" ]; then
            ARGS+=(--only $SLUGS)
          fi
          python3 -m backend.scrape.firecrawl_scraper "${ARGS[@]}"

      - name: Commit and push probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/probes/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Firecrawl probe ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
