name: Scrape all Tier-1 venues

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scrape from and commit to"
        required: false
        default: "claude/add-opus-code-iSPrR"

permissions:
  contents: write

concurrency:
  group: scrape-all-tier1
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{{{ github.event.inputs.branch || 'claude/add-opus-code-iSPrR' }}}}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet crawl4ai pydantic anthropic fastapi
          python3 -m crawl4ai-setup

      - name: Run all Tier-1 scrapers
        env:
          ANTHROPIC_API_KEY: ${{{{ secrets.ANTHROPIC_API_KEY }}}}
          PYTHONUNBUFFERED: "1"
        run: python3 -m backend.scrape.run_scraper --all-tier 1

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/*_events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh Tier-1 events (manual scrape run)"
          BRANCH="${{GITHUB_REF_NAME:-claude/add-opus-code-iSPrR}}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
