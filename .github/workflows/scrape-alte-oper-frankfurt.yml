name: Scrape Alte Oper Frankfurt

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scrape from and commit to"
        required: false
        default: "claude/add-opus-code-iSPrR"

permissions:
  contents: write

concurrency:
  group: scrape-alte-oper-frankfurt
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'claude/add-opus-code-iSPrR' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet crawl4ai pydantic anthropic fastapi
          python3 -m crawl4ai-setup

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 -m backend.scrape.run_scraper alte_oper_frankfurt

      - name: Show summary
        run: |
          python3 -c "
          import json
          with open('backend/alte_oper_frankfurt_events.json') as f:
              data = json.load(f)
          total = data.get('total_events', 0)
          print(f'Total events: {total}')
          for e in data.get('events', [])[:5]:
              print(f"  {e.get('date','')}: {e.get('title','')[:60]}")
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alte_oper_frankfurt_events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh alte_oper_frankfurt_events.json (manual scrape)"
          BRANCH="${GITHUB_REF_NAME:-claude/add-opus-code-iSPrR}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
